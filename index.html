                                            <button onClick={() => setCurrentView(TEST_TYPES.MANAGE_TESTS)} className={`w-full flex items-center gap-4 px-6 py-3 text-left ${currentView === TEST_TYPES.MANAGE_TESTS ? 'bg-blue-600 text-white border-r-4 border-white' : 'text-slate-400 hover:bg-slate-800 hover:text-white transition-colors'}`}>
                                                <i className="fa-solid fa-trash-can w-5"></i><span className="font-semibold">Manage & Remove Tests</span>
                                            </button>
                                        </>
                                    )}
                                </nav>
                                <div className="mb-4">
                                    <button onClick={() => setCurrentView(TEST_TYPES.LOGIN)} className={`w-full flex items-center gap-4 px-6 py-3 text-left ${currentView === TEST_TYPES.LOGIN ? 'bg-blue-600 text-white border-r-4 border-white' : 'text-slate-400 hover:bg-slate-800 hover:text-white transition-colors'}`}>
                                        <i className="fa-solid fa-gear w-5"></i><span className="font-semibold">Settings / Login</span>
                                    </button>
                                </div>
                            </div>
                        </aside>
                    )}

                    <div className="flex-1 flex flex-col h-full overflow-hidden">
                        {!isTesting && currentView !== TEST_TYPES.RESULTS && currentView !== TEST_TYPES.SOLUTION && currentView !== TEST_TYPES.ANALYSIS && currentView !== TEST_TYPES.LOGIN && (
                            <header className="bg-white h-16 shadow-sm border-b border-slate-200 flex items-center justify-between px-6 flex-shrink-0">
                                <div className="flex items-center gap-4">
                                    <button onClick={() => setIsSidebarOpen(!isSidebarOpen)} className="text-slate-500 hover:text-slate-800 lg:hidden"><i className="fa-solid fa-bars text-xl"></i></button>
                                    <h2 className="text-lg font-bold text-slate-800 hidden sm:block">Unlimited Gyan Test</h2>
                                </div>
                                <div className={`flex items-center gap-2 text-[11px] font-bold px-3 py-1.5 rounded-full border ${userAuth ? 'bg-green-50 text-slate-600 border-green-200' : 'bg-red-50 text-red-600 border-red-200'}`}>
                                    <i className={`fa-solid ${userAuth ? 'fa-cloud text-green-500' : 'fa-circle-xmark text-red-500'}`}></i> Cloud Sync: {userEmail}
                                </div>
                            </header>
                        )}

                        <main className={`flex-1 overflow-y-auto ${isTesting || currentView === TEST_TYPES.LOGIN ? 'test-fullscreen p-0' : 'p-6 md:p-10'}`}>
                            
                            {currentView === TEST_TYPES.LOGIN && (
                                <LoginView authMethods={firebaseMethods} authInstance={firebaseMethods?.authInstance} user={userAuth} />
                            )}

                            {currentView === TEST_TYPES.TEST_GENERATOR && isMaster && (
                                <AlpTestGeneratorView 
                                    firebaseMethods={firebaseMethods}
                                    firebaseDb={firebaseDb}
                                    appId={appIdRef.current}
                                    onTestAdded={(newTest) => {
                                        setUploadedTests(prev => [...prev, newTest]);
                                        try {
                                            const currentTests = JSON.parse(localStorage.getItem('ug_global_tests') || '[]');
                                            currentTests.push(newTest);
                                            localStorage.setItem('ug_global_tests', JSON.stringify(currentTests));
                                        } catch(e) {
                                            console.warn("Local storage quota exceeded. Test saved to Master Cloud successfully, but local cache skipped.");
                                        }
                                        setCurrentView(TEST_TYPES.MOCK_SERIES);
                                    }} 
                                />
                            )}

                            {currentView === TEST_TYPES.UPLOADER && isMaster && (
                                <TestUploaderView 
                                    firebaseMethods={firebaseMethods}
                                    firebaseDb={firebaseDb}
                                    appId={appIdRef.current}
                                    onTestAdded={(newTest) => {
                                        setUploadedTests(prev => [...prev, newTest]);
                                        try {
                                            const currentTests = JSON.parse(localStorage.getItem('ug_global_tests') || '[]');
                                            currentTests.push(newTest);
                                            localStorage.setItem('ug_global_tests', JSON.stringify(currentTests));
                                        } catch(e) {
                                            console.warn("Local storage quota exceeded. Test saved to Master Cloud successfully, but local cache skipped.");
                                        }
                                        setCurrentView(TEST_TYPES.MOCK_SERIES);
                                    }} 
                                />
                            )}

                            {currentView === TEST_TYPES.MANAGE_TESTS && isMaster && (
                                <TestManagerView 
                                    firebaseMethods={firebaseMethods}
                                    firebaseDb={firebaseDb}
                                    appId={appIdRef.current}
                                    allTests={allTests}
                                    uploadedTests={uploadedTests}
                                    setUploadedTests={setUploadedTests}
                                    deletedTestIds={deletedTestIds}
                                    setDeletedTestIds={setDeletedTestIds}
                                />
                            )}

                            {currentView === TEST_TYPES.MENU && (
                                <div className="max-w-6xl mx-auto animate-fade-in flex flex-col items-start mt-10">
                                    <img src="Gemini_Generated_Image_8uggs18uggs18ugg.png" alt="Unlimited Gyan Logo" className="w-40 h-40 object-cover rounded-2xl shadow-lg mb-8 bg-black" onError={(e) => { e.target.src = 'https://placehold.co/100x100/000/fff?text=Logo'; }} />
                                    <h2 className="text-3xl font-extrabold text-slate-800 mb-6">Welcome to Unlimited Gyan Test</h2>
                                    <button onClick={() => setCurrentView(TEST_TYPES.MOCK_SERIES)} className="bg-blue-600 text-white px-8 py-4 rounded-xl font-bold shadow-lg hover:bg-blue-700 transition-all">Go to Mock Test Series <i className="fa-solid fa-arrow-right ml-2"></i></button>
                                </div>
                            )}

                            {currentView === TEST_TYPES.MOCK_SERIES && (
                                <div className="max-w-7xl mx-auto animate-fade-in">
                                    <div className="flex overflow-x-auto hide-scrollbar gap-4 mb-8 w-full pt-2 border-b border-slate-200 pb-2">
                                        {dynamicCategories.map(cat => (
                                            <button key={cat.id} onClick={() => setActiveFilter(cat.id)} className={`px-4 py-2 whitespace-nowrap text-[14px] font-semibold transition-all rounded ${activeFilter === cat.id ? 'bg-[#789ca4] text-white shadow-sm' : 'text-slate-500 hover:text-slate-800'}`}>
                                                {cat.label} ({cat.count})
                                            </button>
                                        ))}
                                    </div>

                                    {filteredTests.length === 0 ? (
                                        <div className="flex flex-col items-center justify-center py-16 px-4 bg-white rounded-xl border border-slate-200 shadow-sm text-center">
                                            <i className="fa-solid fa-folder-open text-6xl text-slate-200 mb-4"></i>
                                            <h3 className="text-2xl font-bold text-slate-700 mb-2">No tests available in this category</h3>
                                            <p className="text-slate-500 font-medium">Please select another category or wait for tests to be published.</p>
                                        </div>
                                    ) : (
                                        <div className="flex flex-col gap-6 w-full">
                                            {filteredTests.map((test, index) => {
                                                const isCompleted = !!completedTests[test.id];
                                                return (
                                                    <div key={index} className="bg-white border border-slate-200 rounded-lg overflow-hidden shadow-sm flex flex-col w-full">
                                                        <div className="p-5 flex flex-col sm:flex-row sm:items-center justify-between border-b border-slate-100 gap-4">
                                                            <div>
                                                                <div className="flex items-center gap-3 mb-3">
                                                                    <h3 className="text-[17px] font-bold text-[#1e1b4b]">{test.title}</h3>
                                                                </div>
                                                                <div className="flex flex-wrap items-center gap-4 text-xs font-semibold text-slate-500">
                                                                    <span className="flex items-center gap-1 text-[#0ea5e9]"><i className="fa-regular fa-circle-question"></i> {test.questions} Questions</span>
                                                                    <span className="flex items-center gap-1 text-[#f59e0b]"><i className="fa-regular fa-file-lines"></i> {test.questions}.00 Marks</span>
                                                                    <span className="flex items-center gap-1 text-[#22c55e]"><i className="fa-regular fa-clock"></i> {test.time}</span>
                                                                </div>
                                                            </div>
                                                            <div className="flex gap-2 w-full sm:w-auto">
                                                                <button onClick={() => {
                                                                    if(!userAuth) {
                                                                        setCurrentView(TEST_TYPES.LOGIN);
                                                                    } else {
                                                                        handleAction(isCompleted ? 'REATTEMPT' : 'ATTEMPT', test)
                                                                    }
                                                                }} className="bg-[#312e81] hover:bg-[#232f3e] text-white font-semibold py-2 px-5 rounded text-sm transition-colors shadow-sm whitespace-nowrap">
                                                                    {isCompleted ? 'Re-Attempt Test' : 'Attempt Now'}
                                                                </button>
                                                                <button onClick={() => handleAction('SOLUTION', test)} disabled={!isCompleted} className={`border font-semibold py-2 px-4 rounded text-sm transition-colors whitespace-nowrap ${isCompleted ? 'border-[#312e81] text-[#312e81] hover:bg-slate-50' : 'border-slate-200 text-slate-400 cursor-not-allowed'}`}>
                                                                    Solution
                                                                </button>
                                                                <button onClick={() => handleAction('ANALYSIS', test)} disabled={!isCompleted} className={`border font-semibold py-2 px-4 rounded text-sm transition-colors whitespace-nowrap ${isCompleted ? 'border-[#312e81] text-[#312e81] hover:bg-slate-50' : 'border-slate-200 text-slate-400 cursor-not-allowed'}`}>
                                                                    Analysis
                                                                </button>
                                                            </div>
                                                        </div>
                                                        <div className="px-5 py-4 bg-white">
                                                            <table className="w-full text-left border-collapse border border-slate-200 bg-white text-[13px]">
                                                                <thead className="bg-slate-50 text-slate-700 font-bold border-b border-slate-200">
                                                                    <tr>
                                                                        <th className="p-2 border-r border-slate-200">Section Name</th>
                                                                        <th className="p-2 border-r border-slate-200">Question</th>
                                                                        <th className="p-2">Time</th>
                                                                    </tr>
                                                                </thead>
                                                                <tbody className="text-slate-600 font-medium">
                                                                    <tr>
                                                                        <td className="p-2 border-r border-slate-200">{test.category} Test</td>
                                                                        <td className="p-2 border-r border-slate-200">{test.questions}</td>
                                                                        <td className="p-2">{test.time}</td>
                                                                    </tr>
                                                                </tbody>
                                                            </table>
                                                        </div>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    )}
                                </div>
                            )}

                            {currentView === TEST_TYPES.INSTRUCTIONS && selectedTest && (
                                <div className="max-w-4xl mx-auto mt-4 animate-fade-in">
                                    <div className="bg-white rounded-2xl shadow-lg border border-slate-200 overflow-hidden">
                                        <div className="bg-[#232f3e] p-8 text-white"><h2 className="text-3xl font-black tracking-wide">{selectedTest.title}</h2></div>
                                        <div className="p-8">
                                            <p className="text-slate-700 text-lg leading-relaxed">{selectedTest.instructions}</p>
                                            <div className="flex justify-end gap-4 border-t border-slate-100 pt-8 mt-8">
                                                <button onClick={() => setCurrentView(TEST_TYPES.MOCK_SERIES)} className="px-8 py-4 text-slate-500 hover:bg-slate-100 rounded-xl font-bold transition-colors">Cancel</button>
                                                <button onClick={beginTest} className="px-10 py-4 bg-[#312e81] hover:bg-[#232f3e] text-white rounded-xl font-bold shadow-lg flex items-center gap-3 text-lg">Start Examination <i className="fa-solid fa-play"></i></button>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {currentView === TEST_TYPES.ANALYSIS && completedTests[selectedTest.id] && (
                                <div className="max-w-6xl mx-auto mt-4 animate-fade-in bg-white shadow-sm border border-slate-200">
                                    <div className="flex border-b border-slate-200 bg-slate-50">
                                        <button className="px-8 py-3 bg-[#fdf2f2] text-slate-700 font-semibold border-t-2 border-red-500 border-r border-slate-200">Attempt 1</button>
                                    </div>
                                    
                                    <div className="p-6">
                                        <div className="mb-8">
                                            <h3 className="font-bold text-slate-700 text-lg mb-4">Expert's Comment</h3>
                                            <div className="border border-slate-200 rounded-lg p-6 shadow-sm">
                                                <h2 className="text-3xl font-bold text-blue-700">The level of the exam is easy-moderate</h2>
                                            </div>
                                        </div>

                                        <div className="mb-10">
                                            <div className="flex items-center gap-3 mb-6">
                                                <h3 className="font-bold text-slate-700 text-lg">Overall Performance Summary</h3>
                                                <span className="bg-red-500 text-white px-2 py-0.5 rounded text-xs font-bold">Cut Off: 42</span>
                                            </div>
                                            
                                            <div className="flex flex-wrap justify-between items-center px-4 md:px-12">
                                                <div className="flex flex-col items-center">
                                                    <div className="w-28 h-28 rounded-full border-4 border-slate-100 flex items-center justify-center relative">
                                                        <div className="absolute inset-0 rounded-full border-[5px] border-red-400 border-t-transparent border-l-transparent transform rotate-45"></div>
                                                        <div className="text-center">
                                                            <div className="text-sm font-bold text-slate-700">--/--</div>
                                                            <div className="text-[10px] text-slate-400">Rank</div>
                                                        </div>
                                                    </div>
                                                </div>
                                                <div className="flex flex-col items-center">
                                                    <div className="w-28 h-28 rounded-full border-4 border-slate-100 flex items-center justify-center relative">
                                                        <div className="absolute inset-0 rounded-full border-[5px] border-[#38bdf8] border-r-transparent transform -rotate-45"></div>
                                                        <div className="text-center">
                                                            <div className="text-sm font-bold text-slate-700">{completedTests[selectedTest.id].tScore.toFixed(2)}</div>
                                                            <div className="text-[10px] text-slate-400">T-Score</div>
                                                        </div>
                                                    </div>
                                                </div>
                                                <div className="flex flex-col items-center">
                                                    <div className="w-28 h-28 rounded-full border-4 border-slate-100 flex items-center justify-center relative">
                                                        <div className="absolute inset-0 rounded-full border-[5px] border-blue-600 border-b-transparent transform -rotate-45"></div>
                                                        <div className="text-center">
                                                            <div className="text-sm font-bold text-slate-700">{completedTests[selectedTest.id].totalAttempted}/{selectedTest.questions}</div>
                                                            <div className="text-[10px] text-slate-400">Attempted</div>
                                                        </div>
                                                    </div>
                                                </div>
                                                <div className="flex flex-col items-center">
                                                    <div className="w-28 h-28 rounded-full border-4 border-slate-100 flex items-center justify-center relative">
                                                        <div className="absolute inset-0 rounded-full border-[5px] border-green-500 border-l-transparent transform rotate-12"></div>
                                                        <div className="text-center">
                                                            <div className="text-sm font-bold text-slate-700">{completedTests[selectedTest.id].totalAttempted ? ((completedTests[selectedTest.id].correct / completedTests[selectedTest.id].totalAttempted)*100).toFixed(2) : 0}%</div>
                                                            <div className="text-[10px] text-slate-400">Accuracy</div>
                                                        </div>
                                                    </div>
                                                </div>
                                                <div className="flex flex-col items-center">
                                                    <div className="w-28 h-28 rounded-full border-4 border-slate-100 flex items-center justify-center relative">
                                                        <div className="absolute inset-0 rounded-full border-[5px] border-orange-400 border-t-transparent border-l-transparent transform rotate-90"></div>
                                                        <div className="text-center">
                                                            <div className="text-sm font-bold text-slate-700">--%</div>
                                                            <div className="text-[10px] text-slate-400">Percentile</div>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>

                                        <div className="border-t border-slate-200 pt-8 mb-6">
                                            <h3 className="font-bold text-slate-700 text-lg mb-6">Section wise performance</h3>
                                            
                                            <div className="w-64 bg-[#fff9ea] rounded-xl border border-slate-200 shadow-sm p-4 relative overflow-hidden">
                                                <div className="absolute top-0 left-0 w-full h-1 bg-yellow-400"></div>
                                                <h4 className="font-bold text-slate-800 text-[15px] mb-4">{selectedTest.title}</h4>
                                                
                                                <div className="flex justify-between items-center text-xs text-slate-600 mb-2">
                                                    <span>Score</span>
                                                    <span className="font-bold text-slate-800">{completedTests[selectedTest.id].correct} <span className="text-[10px] text-slate-400 font-normal">/{selectedTest.questions}</span></span>
                                                </div>
                                                <div className="flex justify-between items-center text-xs text-slate-600 mb-2">
                                                    <span>Attempted</span>
                                                    <span className="font-bold text-slate-800">{completedTests[selectedTest.id].totalAttempted} <span className="text-[10px] text-slate-400 font-normal">/{selectedTest.questions}</span></span>
                                                </div>
                                                <div className="flex justify-between items-center text-xs text-slate-600 mb-2">
                                                    <span>Accuracy</span>
                                                    <span className="font-bold text-slate-800">{completedTests[selectedTest.id].totalAttempted ? ((completedTests[selectedTest.id].correct / completedTests[selectedTest.id].totalAttempted)*100).toFixed(2) : 0} %</span>
                                                </div>
                                                <div className="flex justify-between items-center text-xs text-slate-600 mb-4">
                                                    <span>Average</span>
                                                    <span className="font-bold text-slate-800">--</span>
                                                </div>

                                                <div className="border-t border-slate-200 pt-3 flex justify-between items-center text-xs text-slate-600 mb-2">
                                                    <span>T score:</span>
                                                    <span className="font-bold text-slate-800">{completedTests[selectedTest.id].tScore.toFixed(2)}</span>
                                                </div>
                                                <div className="flex justify-between items-center text-xs text-slate-600">
                                                    <span>Status</span>
                                                    <span className={`font-bold ${completedTests[selectedTest.id].tScore >= 42 ? 'text-indigo-800' : 'text-red-600'}`}>{completedTests[selectedTest.id].tScore >= 42 ? 'Qualified' : 'Not Qualified'}</span>
                                                </div>
                                            </div>
                                        </div>

                                        <div className="mt-10 text-right">
                                            <button onClick={() => setCurrentView(TEST_TYPES.MOCK_SERIES)} className="bg-[#312e81] text-white px-8 py-2 rounded-lg font-bold hover:bg-[#232f3e]">Back to Dashboard</button>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {currentView === TEST_TYPES.SOLUTION && selectedTest && completedTests[selectedTest.id] && (
                                <SolutionViewer testConfig={selectedTest} result={completedTests[selectedTest.id]} onBack={() => setCurrentView(TEST_TYPES.MOCK_SERIES)} />
                            )}

                            {}
                            {currentView === TEST_TYPES.CONCENTRATION && <ObservationTest config={selectedTest} testId={selectedTest.id} onComplete={onTestComplete} />}
                            {currentView === TEST_TYPES.FIND_6 && <Find6Test config={selectedTest} testId={selectedTest.id} onComplete={onTestComplete} />}
                            {currentView === TEST_TYPES.TABLE && <TableTest config={selectedTest} onComplete={onTestComplete} />}
                            {currentView === TEST_TYPES.MEMORY && <MemoryTest config={selectedTest} testId={selectedTest.id} onComplete={onTestComplete} />}
                            {currentView === TEST_TYPES.PERCEPTUAL && <PerceptualSpeedTest config={selectedTest} testId={selectedTest.id} onComplete={onTestComplete} />}
                            {currentView === TEST_TYPES.CUSTOM_HTML && <CustomHtmlTest config={selectedTest} onComplete={onTestComplete} />}

                            {currentView === TEST_TYPES.RESULTS && results && (
                                <div className="w-full h-full flex items-center justify-center animate-fade-in p-6">
                                    <div className="w-full max-w-3xl bg-white rounded-2xl shadow-2xl border border-slate-200 p-10 text-center relative overflow-hidden">
                                        {results.tScore !== undefined && (
                                            <div className={`absolute top-0 left-0 w-full p-4 font-black text-white text-xl uppercase tracking-widest ${results.tScore >= 42 ? 'bg-[#22c55e]' : 'bg-[#ef4444]'}`}>
                                                {results.tScore >= 42 ? 'PASSED (T-Score ≥ 42)' : 'FAILED (T-Score < 42)'}
                                            </div>
                                        )}
                                        <div className="mt-12 mb-6">
                                            <h2 className="text-4xl font-black text-slate-800">Parinaam (Result)</h2>
                                            <p className="text-slate-500 font-semibold">{selectedTest?.title}</p>
                                        </div>
                                        <div className="grid grid-cols-3 gap-6 mb-10">
                                            <div className="bg-slate-50 py-8 px-4 rounded-xl border shadow-sm">
                                                <div className="text-4xl font-black text-slate-700 mb-2">{results.totalAttempted}</div>
                                                <div className="text-xs font-bold text-slate-500 uppercase tracking-wider">Attempted</div>
                                            </div>
                                            <div className="bg-[#eff6ff] py-8 px-4 rounded-xl border border-[#bae6fd] shadow-sm">
                                                <div className="text-4xl font-black text-[#2563eb] mb-2">{results.correct}</div>
                                                <div className="text-xs font-bold text-[#1d4ed8] uppercase tracking-wider">Raw Score</div>
                                            </div>
                                            <div className={`py-8 px-4 rounded-xl border shadow-sm ${results.tScore >= 42 ? 'bg-[#f0fdf4] border-[#bbf7d0]' : 'bg-[#fef2f2] border-[#fecaca]'}`}>
                                                <div className={`text-4xl font-black mb-2 ${results.tScore >= 42 ? 'text-[#16a34a]' : 'text-[#dc2626]'}`}>
                                                    {results.tScore ? results.tScore.toFixed(2) : '--'}
                                                </div>
                                                <div className="text-xs font-bold uppercase tracking-wider">T-Score Normalized</div>
                                            </div>
                                        </div>
                                        <div className="flex gap-4 justify-center">
                                            <button onClick={() => handleAction('REATTEMPT', selectedTest)} className="bg-[#f59e0b] hover:bg-[#ea580c] text-white px-8 py-4 rounded-xl font-bold shadow-md transition-transform transform hover:-translate-y-1 text-lg">
                                                Re-Attempt Test
                                            </button>
                                            <button onClick={() => setCurrentView(TEST_TYPES.MOCK_SERIES)} className="bg-slate-900 hover:bg-slate-800 text-white px-8 py-4 rounded-xl font-bold shadow-md transition-transform transform hover:-translate-y-1 text-lg flex items-center gap-3">
                                                <i className="fa-solid fa-home"></i> Back to Dashboard
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            )}

                        </main>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
