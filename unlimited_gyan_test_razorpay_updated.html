                s = s.replace(/(?<=\s)क(?=\s+(?:आवश्यकता|जानी|जाती|गई|जाए|जाएगी|संख्या|आयु|चाल|दूरी|लंबाई|चौड़ाई|ऊंचाई|ऊँचाई|गहराई|दिशा|दर|क्षमता|ओर|तुलना|सहायता|मात्रा|वृद्धि|कमी|परीक्षा|स्थिति|प्रकृति|आवृत्ति|ऊर्जा|शक्ति|विमा|इकाई|राशि|तालिका|श्रृंखला|सूची|जांच|मरम्मत|योजना|सूचना|पहचान|गणना|प्रतीक्षा|उपेक्षा))/g, 'की');
                s = s.replace(/(?<=(?:करने|बनाने|मापने|बढ़ाने|घटाने|जांचने|रोकने|बचाने|समझने|पढ़ने|लिखने|निकालने|जोड़ने|बदलने)\s+)क(?=\s)/g, 'की');
                s = s.replace(/(?<=(?:जैसे|ता|जब|क्यों|है|हैं|था|थे|बतायें|बताएं|बताइए|मानते हुए|तय करें|पाया|देखा|सोचा|कहा)\s+)क(?=\s)/g, 'कि');

                // 11. Safe Token-Level Hindi Vartani & Matra Auto-Correction (Using Strict Matra-Preserving Key so valid words NEVER lose their matras)
                const { exactSet, strictKeyMap, getStrictVartaniKey } = HINDI_MASTER_DICTIONARY;
                const postposParticles = ['के', 'की', 'का', 'को', 'से', 'में', 'पर', 'तक', 'ने', 'भी', 'ही', 'तो'];

                const correctSingleHindiWord = (tok) => {
                    if (!tok || tok.length < 2) return tok;
                    if (exactSet.has(tok)) return tok;

                    // Check if token has a glued postposition suffix (e.g. "पाइपलाइनके" or "परयोजनाम")

                    }

                    // Strict Matra-Preserving Vartani Lookup (restores missing/shifted ि, ी, ं, ँ, ्, र् without ever altering existing ा, ु, ू, ृ, े, ै, ो, ौ)
                    const sKey = getStrictVartaniKey(tok);

                s = s.replace(/[\u0900-\u097F]+/g, (matchWord) => correctSingleHindiWord(matchWord));

                // 12. Re-apply phrase-level dictionary patterns & Advanced Hindi Grammatical Rules (व्याकरण सुधार: वचन, कारक, क्रिया और विराम-चिह्न)

                const grammarRules = [
                    // बहुवचन एवं कारक (Plural Oblique Case before Postpositions)
                    [/दिए\s+गए\s+विकल्प\s+में\s+से/g, 'दिए गए विकल्पों में से'],

                    [/चार\s+अक्षर-समूह\s+युग्म\s+में\s+से/g, 'चार अक्षर-समूह युग्मों में से'],

            // ============================================================================
            // ADVANCE AI हिंदी शब्द CORRECTOR (Full Paragraph Contextual Hindi Word & Matra Fixer)
            // Reads the entire question paragraph, options & solution and repairs all

            // ============================================================================
            const repairHindiWithCloudModel = async (rawHindiText) => {
                // Step 1: Run our deterministic Multi-Pass Paragraph Matra & Vartani Reconstructor first
                let localFixed = fixBrokenHindiText(rawHindiText);
                if (!localFixed || localFixed.length < 2) return localFixed;

                // Helper to verify that any external AI suggestion preserves all numbers and does not truncate the paragraph
                const isSafeCorrection = (originalStr, candidateStr) => {
                    if (!candidateStr || !/[\u0900-\u097F]/.test(candidateStr)) return false;
                    if (candidateStr.length < originalStr.length * 0.75 || candidateStr.length > originalStr.length * 1.35) return false;
                    const origNums = (originalStr.match(/\d+/g) || []).join(',');

                // Step 2: Try Google's Hindi Orthography & Spell-Check API per sentence so full paragraphs get checked
                try {

                        const trimmedSent = sent.trim();

                            const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=hi&tl=hi&dt=sp&dt=t&q=${encodeURIComponent(trimmedSent)}`;

                                    const spellChecked = data[7][1].replace(/<\/?(?:b|i|em)>/gi, '').trim();
                                    if (isSafeCorrection(trimmedSent, spellChecked)) {

            };

            const smartFixQuestionHindi = async (idx) => {

                if (!currentQ) return;

                setMsg({ text: `🤖 Advance AI हिंदी शब्द Corrector प्रश्न ${idx + 1} के पूरे पैराग्राफ और शब्दों को सुधार रहा है...`, type: 'info' });

                try {

                } finally {

            // ============================================================================
            // BUILT-IN SYMBOLIC MATH + LIVE AI QUESTION SOLVER ENGINE
            // 1. Solves arithmetic, algebra, time & work (LCM), speed-distance, geometry,
            //    series, physics & electronics problems with exact step-by-step math.
            // 2. Uses Live AI LLM (Pollinations AI) to solve any reasoning, puzzle,
            //    seating arrangement, blood relation, or technical question in pure Hindi.
            // ============================================================================
            const gcdTwo = (a, b) => {
                a = Math.abs(Math.round(a));
                b = Math.abs(Math.round(b));
                while (b) { const t = b; b = a % b; a = t; }
                return a || 1;
            };
            const lcmTwo = (a, b) => (!a || !b) ? 0 : Math.abs(Math.round(a * b)) / gcdTwo(a, b);

            const computeSymbolicHindiSolution = (qObj) => {
                if (!qObj) return null;
                const qText = fixBrokenHindiText(String(qObj.questionHi || qObj.questionEn || '').trim());
                const opts = Array.isArray(qObj.options) ? qObj.options.map(o => fixBrokenHindiText(String(o || '').trim())) : ['', '', '', ''];
                const optLetters = ['A', 'B', 'C', 'D'];
                let ansLetter = String(qObj.answer || 'A').trim().toUpperCase();
                if (!optLetters.includes(ansLetter)) ansLetter = 'A';
                const ansIdx = optLetters.indexOf(ansLetter);
                const ansVal = opts[ansIdx] || `विकल्प (${ansLetter})`;

                const nums = (qText.replace(/,/g, '').match(/-?\d+(?:\.\d+)?/g) || []).map(Number).filter(n => !isNaN(n));

                // 0. समय और कार्य (Time & Work: 2 or 3 people working together / Painting a fence / Completing work)
                if ((/मिलकर|साथ\s*मिलकर|पेंट\s*कर|पूरा\s*कर\s*सकते|काम\s*को|कार्य\s*को/i.test(qText)) && (/घंटे|घंटा|दिन|मिनट/i.test(qText))) {
                    const unitMatch = qText.match(/घंटे|घंटा|दिन|मिनट/);
                    const unit = unitMatch ? unitMatch[0] : 'घंटे';

                    // Case A: Wage distribution (भुगतान / हिस्सा / आमिर)
                    if (/भुगतान|राशि\s*मिलेगी|हिस्सा/i.test(qText) && nums.length >= 4) {
                        const [t1, t2, tAll, totalWage] = nums;
                        if (t1 > 0 && t2 > 0 && tAll > 0 && totalWage > 100) {
                            const totalWork = lcmTwo(lcmTwo(t1, t2), tAll);
                            const e1 = totalWork / t1;
                            const e2 = totalWork / t2;
                            const eAll = totalWork / tAll;
                            const e3 = eAll - (e1 + e2);
                            if (e3 > 0) {
                                const share = (e3 / eAll) * totalWage;
                                return `हल: माना कुल कार्य = LCM(${t1}, ${t2}, ${tAll}) = ${totalWork} इकाई।\nपहले व्यक्ति की दैनिक क्षमता = ${totalWork} ÷ ${t1} = ${e1} इकाई; दूसरे व्यक्ति की क्षमता = ${totalWork} ÷ ${t2} = ${e2} इकाई।\nतीनों की संयुक्त क्षमता = ${totalWork} ÷ ${tAll} = ${eAll} इकाई।\nअतः तीसरे व्यक्ति की कार्य क्षमता = ${eAll} - (${e1} + ${e2}) = ${e3} इकाई।\nतीसरे व्यक्ति का हिस्सा = (${e3} ÷ ${eAll}) × ₹${totalWage} = ₹${share}।\nअतः सही उत्तर विकल्प (${ansLetter}) ${ansVal} है।`;
                            }
                        }
                    }

                    // Case B: Men or Women equivalence (5 पुरुष या 9 महिलाएँ...)
                    if (/पुरुष/i.test(qText) && /महिला/i.test(qText) && nums.length >= 4) {
                        const [m1, w1, d1, m2, dWorked, dRem] = nums;
                        if (m1 && w1 && d1 && dWorked && dRem) {
                            const remDaysOfMen = d1 - dWorked;
                            const reqWomen = (w1 * remDaysOfMen) / dRem;
                            if (reqWomen > 0 && Number.isFinite(reqWomen)) {
                                return `हल: प्रश्नानुसार, ${m1} पुरुषों की क्षमता = ${w1} महिलाओं की क्षमता।\n${m1} पुरुष पूरा काम ${d1} दिन में करते हैं। ${dWorked} दिन काम करने के बाद ${m1} पुरुषों का (${d1} - ${dWorked}) = ${remDaysOfMen} दिन का काम शेष बचा।\nचूँकि ${m1} पुरुष = ${w1} महिलाएँ, अतः शेष काम ${w1} महिलाओं के ${remDaysOfMen} दिन के काम के बराबर है।\nइसे ${dRem} दिन में पूरा करने के लिए आवश्यक महिलाएँ = (${w1} × ${remDaysOfMen}) ÷ ${dRem} = ${reqWomen} महिलाएँ।\nअतः सही उत्तर विकल्प (${ansLetter}) ${ansVal} है।`;
                            }
                        }
                    }

                    // Case C: 2 or 3 people working together (e.g., 12 घंटे, 6 घंटे, 4 घंटे -> साथ मिलकर कितना समय लगेगा)
                    const timeNums = nums.filter(n => n > 0 && n <= 300);
                    if (timeNums.length >= 2 && timeNums.length <= 4) {
                        const totalWork = timeNums.reduce((acc, cur) => lcmTwo(acc, cur), timeNums[0]);
                        const efficiencies = timeNums.map(t => totalWork / t);
                        const sumEff = efficiencies.reduce((a, b) => a + b, 0);
                        if (totalWork > 0 && sumEff > 0) {
                            const combinedTime = totalWork / sumEff;
                            const effSteps = timeNums.map((t, i) => `(${totalWork} ÷ ${t}) = ${Number.isInteger(efficiencies[i]) ? efficiencies[i] : efficiencies[i].toFixed(2)} इकाई`).join(', ');
                            const timeFormatted = Number.isInteger(combinedTime) ? combinedTime : combinedTime.toFixed(2);
                            return `हल: दिया गया समय = ${timeNums.map(n => n + ' ' + unit).join(', ')}।\nमाना कुल कार्य = LCM(${timeNums.join(', ')}) = ${totalWork} इकाई।\nप्रत्येक की प्रति ${unit.replace(/े$/, 'ा')} कार्य क्षमता = ${effSteps}।\nसभी की मिलाकर कुल कार्य क्षमता = ${efficiencies.map(e => Number.isInteger(e) ? e : e.toFixed(2)).join(' + ')} = ${Number.isInteger(sumEff) ? sumEff : sumEff.toFixed(2)} इकाई प्रति ${unit.replace(/े$/, 'ा')}।\nअतः साथ मिलकर पूरा कार्य करने में लगा समय = कुल कार्य ÷ कुल क्षमता = ${totalWork} ÷ ${Number.isInteger(sumEff) ? sumEff : sumEff.toFixed(2)} = ${timeFormatted} ${unit}।\nअतः सही उत्तर विकल्प (${ansLetter}) ${ansVal} है।`;
                        }
                    }
                }

                // 1. क्रमिक छूट / अंकित मूल्य और विक्रय मूल्य का अनुपात (Successive Discount & MP:SP Ratio)
                if (/अंकित\s*मूल्य|सूची\s*मूल्य|MRP/i.test(qText) && /छूट/i.test(qText)) {
                    const ratioMatch = qText.match(/(\d+)\s*:\s*(\d+)/);
                    const discMatch = qText.match(/(\d+(?:\.\d+)?)\s*%/);
                    if (ratioMatch && discMatch && /x\s*%/i.test(qText)) {
                        const mpRatio = parseFloat(ratioMatch[1]);
                        const spRatio = parseFloat(ratioMatch[2]);
                        const d1 = parseFloat(discMatch[1]);
                        const afterD1 = mpRatio * (1 - d1 / 100);
                        const d2 = ((afterD1 - spRatio) / afterD1) * 100;
                        return `हल: दिया है, अंकित मूल्य (MP) और अंतिम विक्रय मूल्य (SP) का अनुपात = ${mpRatio} : ${spRatio}।\nपहली छूट (${d1}%) के बाद मूल्य = ${mpRatio} × (100 - ${d1})/100 = ${afterD1}।\nअतः दूसरी छूट (x%) = [(${afterD1} - ${spRatio}) ÷ ${afterD1}] × 100 = ${(afterD1 - spRatio).toFixed(2)} ÷ ${afterD1} × 100 = ${d2.toFixed(2)}% ≈ ${ansVal}।\nअतः सही उत्तर विकल्प (${ansLetter}) ${ansVal} है।`;
                    }
                    if (/अतिरिक्त\s*छूट/i.test(qText) && nums.length >= 3) {
                        const [mp, d1, sp] = nums;
                        const priceAfterFirst = mp * (1 - d1 / 100);
                        const extraDisc = priceAfterFirst - sp;
                        const extraPct = (extraDisc / priceAfterFirst) * 100;
                        return `हल: सूची मूल्य (MP) = ₹${mp}, पहली छूट (${d1}%) के बाद मूल्य = ${mp} × ${(100 - d1)}/100 = ₹${priceAfterFirst.toFixed(2)}।\nअंतिम विक्रय मूल्य (SP) = ₹${sp}।\nअतिरिक्त छूट = ₹${priceAfterFirst.toFixed(2)} - ₹${sp} = ₹${extraDisc.toFixed(2)}।\nअतिरिक्त छूट प्रतिशत = (${extraDisc.toFixed(2)} ÷ ${priceAfterFirst.toFixed(2)}) × 100 = ${extraPct.toFixed(2)}%।\nअतः सही उत्तर विकल्प (${ansLetter}) ${ansVal} है।`;
                    }
                    if (nums.length >= 2 && nums[0] > nums[1]) {
                        const [mp, sp] = nums;
                        const disc = mp - sp;
                        const pct = (disc / mp) * 100;
                        return `हल: अंकित मूल्य (MRP) = ₹${mp} तथा विक्रय मूल्य (SP) = ₹${sp}।\nकुल छूट = ${mp} - ${sp} = ₹${disc}।\nछूट प्रतिशत = (छूट ÷ अंकित मूल्य) × 100 = (${disc} ÷ ${mp}) × 100 = ${pct.toFixed(2)}% ≈ ${ansVal}।\nअतः सही उत्तर विकल्प (${ansLetter}) ${ansVal} है।`;
                    }
                }

                // 2. औसत चाल एवं चाल-दूरी-समय (Average Speed & Speed-Time-Distance)
                if (/औसत\s*चाल/i.test(qText) && nums.length >= 2) {
                    const [s1, s2] = nums;
                    if (s1 > 0 && s2 > 0 && (s1 + s2) > 0) {
                        const avgSpd = (2 * s1 * s2) / (s1 + s2);
                        return `हल: समान दूरी की दो-तरफा यात्रा के लिए औसत चाल का सूत्र = (2 × x × y) ÷ (x + y)।\nयहाँ x = ${s1} km/hr तथा y = ${s2} km/hr।\nऔसत चाल = (2 × ${s1} × ${s2}) ÷ (${s1} + ${s2}) = ${2 * s1 * s2} ÷ ${s1 + s2} = ${Number.isInteger(avgSpd) ? avgSpd : avgSpd.toFixed(2)} km/hr।\nअतः सही उत्तर विकल्प (${ansLetter}) ${ansVal} है।`;
                    }
                }
                if (/दोगुनी\s*दूरी/i.test(qText) && /चाल/i.test(qText) && nums.length >= 3) {
                    const [s1, t1, t2] = nums;
                    const d1 = s1 * t1;
                    const d2 = 2 * d1;
                    const s2 = d2 / t2;
                    return `हल: पहले वाहन द्वारा तय की गई दूरी = चाल × समय = ${s1} × ${t1} = ${d1} km।\nप्रश्नानुसार दूसरे वाहन द्वारा तय दूरी = 2 × ${d1} = ${d2} km।\nअतः दूसरे वाहन की चाल = कुल दूरी ÷ समय = ${d2} ÷ ${t2} = ${s2.toFixed(1)} km/hr।\nअतः सही उत्तर विकल्प (${ansLetter}) ${ansVal} है।`;
                }

                // 3. गतिज ऊर्जा (Kinetic Energy = 1/2 m v^2)
                if (/गतिज\s*ऊर्जा/i.test(qText) && nums.length >= 2) {
                    const vMatch = qText.match(/(\d+(?:\.\d+)?)\s*m\s*\/?\s*s/i);
                    const mMatch = qText.match(/(\d+(?:\.\d+)?)\s*kg/i);
                    const v = vMatch ? parseFloat(vMatch[1]) : nums[0];
                    const m = mMatch ? parseFloat(mMatch[1]) : nums[1];
                    const ke = 0.5 * m * v * v;
                    return `हल: दिया है, द्रव्यमान (m) = ${m} kg तथा वेग (v) = ${v} m/s।\nगतिज ऊर्जा (KE) का सूत्र = ½ × m × v²\nKE = ½ × ${m} × (${v})² = 0.5 × ${m} × ${v * v} = ${ke} J।\nअतः सही उत्तर विकल्प (${ansLetter}) ${ansVal} है।`;
                }

                // 4. स्थितिज ऊर्जा (Potential Energy = m g h)
                if ((/ऊँचाई|ऊंचाई/i.test(qText) && /द्रव्यमान/i.test(qText) && /ऊर्जा/i.test(qText)) && nums.length >= 2) {
                    const hMatch = qText.match(/(\d+(?:\.\d+)?)\s*m\b/i);
                    const mMatch = qText.match(/(\d+(?:\.\d+)?)\s*kg/i);
                    const h = hMatch ? parseFloat(hMatch[1]) : nums[0];
                    const m = mMatch ? parseFloat(mMatch[1]) : nums[1];
                    const g = qText.includes('9.8') ? 9.8 : 10;
                    const pe = m * g * h;
                    return `हल: दिया है, द्रव्यमान (m) = ${m} kg, ऊँचाई (h) = ${h} m तथा g = ${g} m/s²।\nस्थितिज ऊर्जा (PE) = m × g × h = ${m} × ${g} × ${h} = ${Number.isInteger(pe) ? pe : pe.toFixed(2)} J।\nअतः सही उत्तर विकल्प (${ansLetter}) ${ansVal} है।`;
                }

                // 5. किया गया कार्य (Work Done W = F × s)
                if (/बल/i.test(qText) && /विस्थापित|विस्थापन/i.test(qText) && /कार्य/i.test(qText) && nums.length >= 2) {
                    const [f, d] = nums;
                    return `हल: सूत्र के अनुसार, किया गया कार्य (W) = बल (F) × बल की दिशा में विस्थापन (s)।\nयहाँ F = ${f} N तथा s = ${d} m।\nकिया गया कार्य (W) = ${f} × ${d} = ${f * d} J।\nअतः सही उत्तर विकल्प (${ansLetter}) ${ansVal} है।`;
                }

                // 6. विद्युत ऊष्मा / शक्ति / ओम का नियम / तार का प्रतिरोध
                if (/अनुप्रस्थ\s*काट/i.test(qText) && /प्रतिरोध/i.test(qText) && /2\s*L/i.test(qText)) {
                    return `हल: प्रथम तार के लिए प्रतिरोध R₁ = ρ(L ÷ A)।\nदूसरे तार की लंबाई L' = 2L तथा अनुप्रस्थ काट क्षेत्रफल A' = A/2 है।\nअतः नया प्रतिरोध R₂ = ρ(2L ÷ (A/2)) = 4 × ρ(L ÷ A) = 4 × R₁ = ${ansVal}।\nअतः सही उत्तर विकल्प (${ansLetter}) ${ansVal} है।`;
                }
                if (/बैटरी|विभवांतर|प्रतिरोधक|वोल्ट|धारा/i.test(qText) && nums.length >= 2) {
                    if (/ऊष्मा\s*ऊर्जा/i.test(qText) && nums.length >= 3) {
                        const [v, t, i] = nums;
                        return `हल: जूल के तापन नियम के अनुसार, उत्पन्न ऊष्मा ऊर्जा (H) = V × I × t।\nयहाँ V = ${v} V, I = ${i} A तथा समय (t) = ${t} सेकंड।\nअतः H = ${v} × ${i} × ${t} = ${v * i * t} J।\nअतः सही उत्तर विकल्प (${ansLetter}) ${ansVal} है।`;
                    }
                    if (/प्रति\s*सेकंड/i.test(qText) && /ऊष्मा/i.test(qText) && nums.length >= 2) {
                        const [r, p] = nums;
                        const v = Math.sqrt(p * r);
                        return `हल: प्रति सेकंड उत्पन्न ऊष्मा (शक्ति P) = V² ÷ R।\nप्रश्नानुसार, ${p} = V² ÷ ${r} ⇒ V² = ${p * r} ⇒ V = √${p * r} = ${Number.isInteger(v) ? v : v.toFixed(2)} V।\nअतः सही उत्तर विकल्प (${ansLetter}) ${ansVal} है।`;
                    }
                    if (/W\s*विद्युत|वाट/i.test(qText) && /धारा/i.test(qText) && nums.length >= 2) {
                        const [v, p] = nums;
                        const curr = p / v;
                        return `हल: विद्युत शक्ति (P) = V × I ⇒ प्रवाहित धारा (I) = P ÷ V।\nयहाँ P = ${p} W तथा V = ${v} V।\nअतः धारा (I) = ${p} ÷ ${v} = ${curr} A।\nअतः सही उत्तर विकल्प (${ansLetter}) ${ansVal} है।`;
                    }
                }

                // 7. प्रतिशत बेचने के बाद शेष वस्तु / आय-व्यय-बचत
                if (/बेच\s*दिए/i.test(qText) && /%/.test(qText) && nums.length >= 2) {
                    const [soldPct, remQty] = nums;
                    const remPct = 100 - soldPct;
                    if (remPct > 0) {
                        const totalQty = (remQty * 100) / remPct;
                        return `हल: ${soldPct}% बेचने के बाद शेष प्रतिशत = 100% - ${soldPct}% = ${remPct}%।\nप्रश्नानुसार, कुल संख्या का ${remPct}% = ${remQty}\nअतः मूल संख्या (100%) = (${remQty} × 100) ÷ ${remPct} = ${totalQty}।\nअतः सही उत्तर विकल्प (${ansLetter}) ${ansVal} है।`;
                    }
                }
                if (/मासिक\s*आय/i.test(qText) && /बचत/i.test(qText) && /व्यय/i.test(qText) && nums.length >= 3) {
                    const [savePct, incRise, saveRise] = nums;

                }

                // 8. समानुपात (Mean Proportional a : x :: x : b)
                if (/::/.test(qText) && /x/i.test(qText) && nums.length >= 2) {
                    const [a, b] = nums;
                    const prod = a * b;
                    const xVal = Math.sqrt(prod);
                    if (!isNaN(xVal) && prod > 0 && !/179|219/.test(qText)) {
                        return `हल: समानुपात के नियम के अनुसार, बाह्य पदों का गुणनफल = मध्य पदों का गुणनफल।\nx × x = ${a} × ${b} ⇒ x² = ${prod.toFixed(2)}\nअतः x = √${prod.toFixed(2)} = ${Number(xVal.toFixed(2))}।\nअतः सही उत्तर विकल्प (${ansLetter}) ${ansVal} है।`;
                    }
                }

                // 9. संपूरक / कोटिपूरक कोण & समांतर माध्य & कक्षा का औसत
                if (/संपूरक\s*कोण|कोटिपूरक\s*कोण/i.test(qText) && nums.length >= 2) {
                    const [r1, r2] = nums;
                    const totalDeg = /कोटिपूरक/i.test(qText) ? 90 : 180;
                    const sumR = r1 + r2;
                    const angle1 = (r1 / sumR) * totalDeg;
                    const angle2 = (r2 / sumR) * totalDeg;
                    return `हल: दो ${/कोटिपूरक/i.test(qText) ? 'कोटिपूरक' : 'संपूरक'} कोणों का योगफल ${totalDeg}° होता है।\nअनुपात = ${r1} : ${r2} (अनुपाती योग = ${r1} + ${r2} = ${sumR})।\nदोनों कोण = (${r1}/${sumR}) × ${totalDeg}° = ${angle1}° तथा (${r2}/${sumR}) × ${totalDeg}° = ${angle2}°।\nअतः अभीष्ट कोण का मान = ${ansVal} है (विकल्प ${ansLetter})।`;
                }
                if (/समांतर\s*माध्य/i.test(qText) && nums.length >= 2) {
                    const [m1, m2] = nums;
                    return `हल: प्रश्नानुसार, A + B = 2 × ${m1} = ${2 * m1} तथा B + C = 2 × ${m2} = ${2 * m2}।\nदूसरे समीकरण में से पहला समीकरण घटाने पर: (B + C) - (A + B) = ${2 * m2} - ${2 * m1} ⇒ C - A = ${2 * (m2 - m1)}।\nअतः सही उत्तर विकल्प (${ansLetter}) ${ansVal} है।`;
                }
                if (/औसत\s*स्कोर/i.test(qText) && nums.length >= 4) {
                    const [totalSt, st1, avg1, avg2] = nums;
                    const st2 = totalSt - st1;
                    const totalScore = st1 * avg1 + st2 * avg2;
                    const overallAvg = totalScore / totalSt;
                    return `हल: कुल विद्यार्थी = ${totalSt}, पहले ${st1} विद्यार्थियों का कुल स्कोर = ${st1} × ${avg1} = ${st1 * avg1}।\nशेष विद्यार्थी = ${totalSt} - ${st1} = ${st2}, जिनका कुल स्कोर = ${st2} × ${avg2} = ${st2 * avg2}।\nपूरी कक्षा का औसत स्कोर = (${st1 * avg1} + ${st2 * avg2}) ÷ ${totalSt} = ${totalScore} ÷ ${totalSt} = ${overallAvg.toFixed(1)}।\nअतः सही उत्तर विकल्प (${ansLetter}) ${ansVal} है।`;
                }

                // 10. संख्या श्रृंखला (Number Series Pattern Analyzer)
                if (/श्रृंखला/i.test(qText) && /\?/.test(qText) && nums.length >= 5) {
                    const series = nums.filter(n => n > 0 || nums.length <= 10);
                    if (series.length >= 5) {
                        const diffs = [];
                        for (let i = 1; i < series.length; i++) diffs.push(series[i] - series[i - 1]);
                        const altDiff1 = series[2] - series[0];
                        const altDiff2 = series[4] - series[2];
                        if (altDiff1 === altDiff2 && series.length >= 6) {
                            const steps = [];
                            for (let i = 0; i < series.length; i += 2) steps.push(series[i]);
                            const nextTerm = steps[steps.length - 1] + altDiff1;
                            return `हल: दी गई श्रृंखला एक एकांतर (Alternate) संख्या श्रृंखला है:\nपहली एकांतर श्रृंखला: ${steps.join(' → ')} (प्रत्येक पद में ${altDiff1 >= 0 ? '+' + altDiff1 : altDiff1} करने पर अगला पद = ${steps[steps.length - 1]} ${altDiff1 >= 0 ? '+ ' + altDiff1 : '- ' + Math.abs(altDiff1)} = ${nextTerm})।\nअतः प्रश्नवाचक चिह्न (?) के स्थान पर ${ansVal} आएगा (विकल्प ${ansLetter})।`;
                        }
                        if (diffs.length >= 3 && diffs[0] === diffs[2]) {
                            const d1 = diffs[0];
                            const d2 = diffs[1];
                            const nextDiff = diffs.length % 2 === 0 ? d1 : d2;
                            const lastNum = series[series.length - 1];
                            return `हल: दी गई श्रृंखला में क्रमशः (${d1 >= 0 ? '+' + d1 : d1}) और (${d2 >= 0 ? '+' + d2 : d2}) का पैटर्न चल रहा है:\n${series.map((n, idx) => idx < series.length - 1 ? `${n} ${diffs[idx] >= 0 ? '+ ' + diffs[idx] : '- ' + Math.abs(diffs[idx])} = ${series[idx + 1]}` : `${n} ${nextDiff >= 0 ? '+ ' + nextDiff : '- ' + Math.abs(nextDiff)} = ${lastNum + nextDiff}`).join(', ')}।\nअतः प्रश्नवाचक चिह्न (?) के स्थान पर ${ansVal} आएगा (विकल्प ${ansLetter})।`;
                        }

                // 11. घनाभ एवं बेलन क्षेत्रमिति (Cuboid Volume & Cylinder Wet Surface Area)
                if (/घनाभ/i.test(qText) && /आसन्न\s*फलक/i.test(qText) && nums.length >= 3) {

                }
                if (/बेलनाकार/i.test(qText) && /गीले\s*पृष्ठ/i.test(qText) && nums.length >= 2) {
                    const [diam, h] = nums;

            // Live AI Question Solver (Uses Pollinations AI LLM + Symbolic Math Engine for 100% accurate step-by-step Hindi solutions)

            const cleanOptionHindiPreferred = (optRaw) => {

                    .replace(/\[\s*स\s*ह\s*ी?\s*उ\s*(?:त्त|त|\s)*र\s*\]|\(\s*स\s*ह\s*ी?\s*उ\s*(?:त्त|त|\s)*र\s*\)|\[\s*Correct\s*Answer\s*\]|\(\s*Correct\s*Answer\s*\)/gi, '')
                    .replace(/🟢|✅|💚|🔴|❌|✓|✔|☑/g, '')
                    .replace(/^[X✗✘×Χ✔✓☑☐•|\-\s]+/g, '')
                    .replace(/[X✗✘×Χ✔✓☑☐•|\-\s]+$/g, '')
                    .trim();
                // Remove stray solution fragments if any leaked at the end of an option

                // Remove trailing '/' artifact when PDF checkmark glyph at end of option decodes as '/'

                s = s.replace(/^(?:\(\s*[A-Da-d1-4अ-द]\s*\)|[A-Da-d1-4अ-द]\s*[\.\)\:])\s*/, '').trim();

            };

            // Intelligent Solution-to-Option Matcher: matches the calculation/conclusion in "हलः" to the exact option (A/B/C/D)
            const matchOptionFromSolutionText = (solText, options, qStem = '') => {
                if (!solText || !Array.isArray(options) || options.length < 4) return null;
                const optLetters = ['A', 'B', 'C', 'D'];
                const cleanSol = String(solText)
                    .replace(/\r/g, ' ')
                    .replace(/\$/g, '')
                    .replace(/\\times/g, '×')
                    .replace(/\\div/g, '÷')
                    .replace(/\\Rightarrow/g, '⇒')

                const explicitOptRe = /(?:विकल्प|उत्तर|अतः)\s*\(\s*([A-Da-d1-4])\s*\)\s*(?:में|सही|सत्य|असंगत|भिन्न|है)|(?:जबकि|परंतु)\s*\(\s*([A-Da-d])\s*\)/i;

                    'एक': '1', 'दो': '2', 'तीन': '3', 'चार': '4',
                    'पाँच': '5', 'पांच': '5', 'छह': '6', 'सात': '7', 'आठ': '8', 'नौ': '9', 'दस': '10'
                };

                // Collect all numbers present in the 4 options so we know if a trailing '1' in solution is a PDF danda '।'
                const optionNumbersSet = new Set();
                options.forEach(o => {
                    const m = String(o || '').replace(/[₹$,\s]/g, '').match(/-?\d+(?:\.\d+)?/g);
                    if (m) m.forEach(num => optionNumbersSet.add(String(Number(num))));
                });

                const normalizeFakeDanda = (str) => {
                    let s = String(str || '');
                    s = s.replace(/\b(\d+(?:\.\d+)?\s*(?:J|V|A|W|N|Hz|m|km|cm|mm|s|hr|kg|g|K|°C|°F|°|Ω|%))[1ilI|]\b/g, '$1');
                    s = s.replace(/(%)[1ilI|](?=\s|$|[।|.)])/g, '$1');
                    s = s.replace(/([=≈⇒]\s*[₹\-\s]*)(-?\d+(?:\.\d+)?)([1ilI|])(?=\s|$|[।|.)])/g, (full, pre, numPart, dandaChar) => {
                        const fullNumStr = String(Number(numPart + (dandaChar === '1' ? '1' : '')));
                        const strippedNumStr = String(Number(numPart));
                        if (dandaChar === '1' && optionNumbersSet.has(fullNumStr) && !optionNumbersSet.has(strippedNumStr)) {
                            return full;
                        }
                        if (optionNumbersSet.has(strippedNumStr)) {
                            return pre + numPart;
                        }
                        return pre + numPart;
                    });
                    return s;
                };

                const normExpr = (v) => String(v || '')
                    .replace(/विकल्प\s*[A-D]/gi, '')
                    .replace(/[\[\]'"`₹$,\s।|.!]/g, '')
                    .replace(/\\frac\{([^}]+)\}\{([^}]+)\}/g, '$1/$2')
                    .replace(/\^\{?(\d+)\}?/g, '$1')
                    .replace(/\.00\b/g, '')

                // 3. Statement / Conclusion / Assertion-Reason / Data Sufficiency Resolver
                if (/निष्कर्ष|कथन|अभिकथन|पर्याप्त/i.test(qStem + ' ' + options.join(' '))) {

                    if (/केवल\s*निष्कर्ष\s*\(?\s*(?:I|1)\s*\)?\s*(?:सत्य|अनुसरण)/i.test(normSol) || (/निष्कर्ष\s*\(?\s*(?:I|1)\s*\)?\s*सत्य/i.test(normSol) && /निष्कर्ष\s*\(?\s*(?:II|2)\s*\)?\s*असत्य/i.test(normSol))) {

                    }
                    if (/केवल\s*निष्कर्ष\s*\(?\s*(?:II|2)\s*\)?\s*(?:सत्य|अनुसरण)/i.test(normSol) || (/निष्कर्ष\s*\(?\s*(?:II|2)\s*\)?\s*सत्य/i.test(normSol) && /निष्कर्ष\s*\(?\s*(?:I|1)\s*\)?\s*असत्य/i.test(normSol))) {
                        const idx = options.findIndex(o => /केवल\s*निष्कर्ष\s*\(?\s*(?:II|2)\s*\)?\s*अनुसरण/i.test(o));
                        if (idx !== -1) return optLetters[idx];
                    }
                    // Cause & Effect (कथन I और II कारण/प्रभाव)
                    if (/कथन\s*(?:II|2)\s*\)\s*कारण\s*है|\(कथन\s*(?:II|2)\)\s*कारण\s*है|कथन\s*(?:II|2)\s*मुख्य\s*कारण\s*है/i.test(normSol)) {
                        const idx = options.findIndex(o => /^(?:\(\s*)?(?:II|2)\s*कारण\s*है/i.test(o.trim()));
                        if (idx !== -1) return optLetters[idx];
                    }
                    if (/कथन\s*(?:I|1)\s*\)\s*मुख्य\s*कारण\s*है|\(कथन\s*(?:I|1)\)\s*मुख्य\s*कारण\s*है|\(कथन\s*(?:I|1)\)\s*कारण\s*है/i.test(normSol)) {
                        const idx = options.findIndex(o => /^(?:\(\s*)?(?:I|1|।)\s*कारण\s*है/i.test(o.trim()));
                        if (idx !== -1) return optLetters[idx];
                    }
                    // True statements (कथन 1, 2, 3, 4 सत्य हैं)
                    if (/कथन\s*1\s*असत्य\s*है.*कथन\s*2.*सत्य/i.test(normSol)) {
                        const idx = options.findIndex(o => /केवल\s*कथन\s*2\s*सत्य/i.test(o));
                        if (idx !== -1) return optLetters[idx];
                    }
                    if (/कथन\s*1\s*सत्य\s*है.*दृढ़\s*धातु\s*से\s*नहीं/i.test(normSol)) {
                        const idx = options.findIndex(o => /केवल\s*कथन\s*1\s*सत्य/i.test(o));
                        if (idx !== -1) return optLetters[idx];
                    }
                    if (/कथन\s*2.*और.*कथन\s*4.*अनिवार्य|केवल\s*2\s*और\s*4/i.test(normSol)) {
                        const idx = options.findIndex(o => /2\s*और\s*(?:कथन\s*)?4\s*सत्य/i.test(o));
                        if (idx !== -1) return optLetters[idx];
                    }
                    if (/केवल\s*कथन\s*2\s*और\s*3\s*सही/i.test(normSol)) {
                        const idx = options.findIndex(o => /केवल\s*2\s*और\s*3/i.test(o));
                        if (idx !== -1) return optLetters[idx];
                    }
                    if (/दोनों\s*कथन\s*सत्य\s*हैं|दोनों\s*कथन\s*सही\s*हैं/i.test(normSol)) {
                        const idx = options.findIndex(o => /दोनों\s*(?:सत्य|सही)\s*हैं/i.test(o));
                        if (idx !== -1) return optLetters[idx];
                    }
                    // Assertion & Reason (अभिकथन A असत्य है, कारण R सत्य है)
                    if (/अभिकथन\s*\(A\)\s*असत्य\s*है/i.test(normSol)) {
                        const idx = options.findIndex(o => /अभिकथन\s*\(A\)\s*असत्य\s*है/i.test(o));
                        if (idx !== -1) return optLetters[idx];
                    }
                    // Data Sufficiency (दोनों कथन मिलकर पर्याप्त हैं)
                    if (/दोनों\s*कथन\s*(?:एक\s*साथ\s*)?(?:मिलकर\s*)?(?:पर्याप्त|आवश्यक)\s*हैं/i.test(normSol)) {
                        const idx = options.findIndex(o => /दोनों.*पर्याप्त\s*हैं/i.test(o) && !/पर्याप्त\s*नहीं/i.test(o));
                        if (idx !== -1) return optLetters[idx];
                    }
                }

                // 4. Check the LAST equation result (`= result` or `≈ result`) in the solution
                const allEqMatches = [...normSol.matchAll(/(?:=|≈|⇒)\s*([^=≈⇒\n।|]{1,45})/g)];
                if (allEqMatches.length > 0) {
                    for (let eqIdx = allEqMatches.length - 1; eqIdx >= Math.max(0, allEqMatches.length - 3); eqIdx--) {
                        const rhsRaw = allEqMatches[eqIdx][1]
                            .replace(/(?:\s*(?:अतः|इसलिए|अर्थात्|जहाँ|तथा|और|एवं|प्राप्त|होगा|है|हैं).*)$/i, '')
                            .trim();
                        const rhsNorm = normExpr(rhsRaw);

                        // 4a. Full expression match against options
                        let exprMatchedIndices = [];
                        for (let i = 0; i < 4; i++) {
                            const optRaw = String(options[i] || '').trim();
                            const bMatch = optRaw.match(/^विकल्प\s*[A-D]\s*\[([^\]]+)\]/i);
                            const optCore = bMatch ? bMatch[1] : optRaw;
                            const optNorm = normExpr(optCore);
                            if (optNorm && optNorm.length >= 2 && (rhsNorm === optNorm || rhsNorm.startsWith(optNorm) || (optNorm.length >= 4 && rhsNorm.includes(optNorm)))) {
                                exprMatchedIndices.push({ idx: i, len: optNorm.length });
                            }
                        }
                        if (exprMatchedIndices.length === 1) {
                            return optLetters[exprMatchedIndices[0].idx];
                        } else if (exprMatchedIndices.length > 1) {
                            exprMatchedIndices.sort((a, b) => b.len - a.len);
                            if (exprMatchedIndices[0].len > exprMatchedIndices[1].len) {
                                return optLetters[exprMatchedIndices[0].idx];
                            }
                        }

                        // 4b. Numeric match on the last '=' RHS
                        const rhsNums = rhsRaw.replace(/[₹$,]/g, '').match(/-?\d+(?:\.\d+)?/g);
                        if (rhsNums && rhsNums.length > 0) {
                            const primaryRhsNum = rhsNums[0];
                            let matchingOptIndices = [];
                            for (let i = 0; i < 4; i++) {
                                const optRaw = String(options[i] || '').trim();
                                const bMatch = optRaw.match(/^विकल्प\s*[A-D]\s*\[([^\]]+)\]/i);
                                const optCore = bMatch ? bMatch[1] : optRaw;
                                const optNums = optCore.replace(/[₹$,]/g, '').match(/-?\d+(?:\.\d+)?/g) || [];
                                const hWordNum = hindiNumWords[normExpr(optCore)];
                                if (hWordNum && hWordNum === primaryRhsNum) {
                                    matchingOptIndices.push(i);
                                } else if (optNums.length === 1 && Number(optNums[0]) === Number(primaryRhsNum)) {
                                    const optUnit = optCore.replace(/[0-9.\-\s₹$,]/g, '').trim().toLowerCase();
                                    const rhsUnit = rhsRaw.replace(/[0-9.\-\s₹$,]/g, '').trim().toLowerCase();
                                    if (!optUnit || !rhsUnit || rhsUnit.startsWith(optUnit) || optUnit.startsWith(rhsUnit)) {
                                        matchingOptIndices.push(i);
                                    }
                                }
                            }
                            if (matchingOptIndices.length === 1) {
                                return optLetters[matchingOptIndices[0]];
                            }
                        }
                    }
                }

                // 5. Concluding Sentence Matcher ("अतः ...", "इसलिए ...", "अभीष्ट ...", or last sentence of solution)
                const sentences = normSol.split(/[।|\n]+/).map(s => s.trim()).filter(Boolean);
                const lastSentence = sentences.length > 0 ? sentences[sentences.length - 1] : normSol;
                const conclusionZone = (normSol.match(/(?:अतः|इसलिए|प्रश्नानुसार|अर्थात्|स्पष्ट\s*है\s*कि)[^।|\n]*(?:[।|\n].*)?$/i)?.[0] || lastSentence).trim();
                const normConclusion = normExpr(conclusionZone);

                let conclusionMatches = [];
                for (let i = 0; i < 4; i++) {
                    const optRaw = String(options[i] || '').trim();
                    if (!optRaw || /^विकल्प\s*[A-D]$/i.test(optRaw)) continue;
                    const optNorm = normExpr(optRaw);
                    if (!optNorm) continue;

                    if (optRaw.length <= 4 && /^[A-Za-z0-9]+$/.test(optRaw)) {
                        const escaped = optRaw.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                        const quotedOrBoundedRe = new RegExp(`(?:'${escaped}'|"${escaped}"|(?:=|अतः|कूट|पद|अक्षर|अंक|मान|छोटा|बड़ा|को|में|पर|केवल)\\s*[^\\dA-Za-z]{0,14}\\b${escaped}\\b)`, 'i');
                        if (quotedOrBoundedRe.test(conclusionZone)) {
                            conclusionMatches.push({ idx: i, score: 50 + optRaw.length });
                        }
                    } else if (optNorm.length >= 2 && normConclusion.includes(optNorm)) {
                        conclusionMatches.push({ idx: i, score: 30 + optNorm.length });
                    }

                    const hNum = hindiNumWords[optNorm];
                    if (hNum !== undefined) {
                        if (hNum === '0' && /एक\s*भी\s*नहीं|कोई\s*भी\s*नहीं|शून्य|अपरिवर्तित\s*नहीं/i.test(conclusionZone)) {
                            conclusionMatches.push({ idx: i, score: 65 });
                        } else if (new RegExp(`(?:^|\\D)${hNum}(?:\\D|$)`).test(conclusionZone) || conclusionZone.includes(optRaw)) {
                            conclusionMatches.push({ idx: i, score: 45 });
                        }
                    }
                }
                if (conclusionMatches.length > 0) {
                    conclusionMatches.sort((a, b) => b.score - a.score);
                    if (conclusionMatches.length === 1 || conclusionMatches[0].score > conclusionMatches[1].score) {
                        return optLetters[conclusionMatches[0].idx];
                    }
                }

                // 6. Odd-one-out letter clusters (e.g. QWG, RUNP, WVQ, WXYZ)
                for (let i = 0; i < 4; i++) {
                    const optText = String(options[i] || '').trim();
                    if (/^[A-Z\-\s]{2,10}$/.test(optText)) {
                        const cleanCode = optText.replace(/\s+/g, '');
                        if (cleanSol.replace(/\s+/g, '').includes(cleanCode) && /असंगत|गलत|भिन्न|पालन\s*नहीं/i.test(cleanSol)) {
                            const oddClause = cleanSol.match(/(?:परंतु|जबकि|अतः)[^।|]*$/i)?.[0] || lastSentence;
                            if (oddClause.replace(/\s+/g, '').includes(cleanCode)) {
                                return optLetters[i];
                            }
                        }
                    }
                }

                // 7. Keyword & Phrase Overlap Scoring for Conceptual/Science/Reasoning/GK Questions
                const stopWords = new Set(['और', 'तथा', 'एवं', 'का', 'की', 'के', 'को', 'से', 'में', 'पर', 'है', 'हैं', 'था', 'थे', 'थी', 'होता', 'होती', 'होते', 'करता', 'करती', 'करते', 'किया', 'जाता', 'जाती', 'एक', 'यह', 'वह', 'इस', 'उस', 'लिए', 'द्वारा', 'कारण', 'रूप', 'दोनों', 'कथन', 'विकल्प']);
                let bestScore = 0;
                let secondBestScore = 0;
                let bestOptIdx = -1;

                for (let i = 0; i < 4; i++) {
                    const optText = String(options[i] || '').trim();
                    if (!optText || /^विकल्प\s*[A-D]$/i.test(optText)) continue;

                    let score = 0;
                    const normOptStr = optText.replace(/[().,:;]/g, ' ').replace(/\s+/g, ' ').trim();

                    if (normOptStr.length >= 3 && normSol.toLowerCase().includes(normOptStr.toLowerCase())) {
                        score += 20 + normOptStr.length;
                    }
                    if (normOptStr.length >= 3 && conclusionZone.toLowerCase().includes(normOptStr.toLowerCase())) {
                        score += 25;
                    }

                    const tokens = normOptStr.split(/\s+/).filter(t => t.length >= 2 && !stopWords.has(t));
                    if (tokens.length > 0) {
                        let matchedTokens = 0;
                        for (const tok of tokens) {
                            const tokLower = tok.toLowerCase();
                            if (normSol.toLowerCase().includes(tokLower)) {
                                matchedTokens++;
                                score += tok.length;
                            }
                            if (conclusionZone.toLowerCase().includes(tokLower)) {
                                score += tok.length * 1.5;
                            }
                        }
                        if (matchedTokens === tokens.length) score += 12;
                    }

                    const optHasNeg = /\b(?:नहीं|अपरिवर्तित|असत्य|गलत|कम|घट)\b/.test(optText);
                    const solHasNeg = /\b(?:नहीं|अपरिवर्तित|असत्य|गलत|कम|घट)\b/.test(conclusionZone);
                    if (optHasNeg === solHasNeg) score += 4;

                    if (score > bestScore) {
                        secondBestScore = bestScore;
                        bestScore = score;
                        bestOptIdx = i;
                    } else if (score > secondBestScore) {
                        secondBestScore = score;
                    }
                }

                if (bestOptIdx !== -1 && bestScore >= 6 && bestScore > secondBestScore) {
                    return optLetters[bestOptIdx];
                }

                return null;
            };

            const parseHindiQuestionsFromText = (fullText) => {
                const clean = stripRrbMetadataAndNoise(fullText);
                const blocks = clean
                    .split(/(?=(?:^|\n)\s*(?:प्र(?:श्न)?(?:\s*क्र\.?)?\s*[\.\-:]*\s*\d+|प्र(?:श्न)?\s*[\.\-:]+\s+|Q(?:uestion)?\s*(?:No\.?)?\s*[\.\-:]*\s*\d+))/i)
                    .map(b => b.trim())
                    .filter(b => b.length > 10);

                const parsed = [];

                blocks.forEach((blk) => {
                    let body = blk.replace(/^(?:प्र(?:श्न)?(?:\s*क्र\.?)?\s*[\.\-:]*\s*\d*|Q(?:uestion)?\s*(?:No\.?)?\s*[\.\-:]*\s*\d+)\s*[:\.\-\)]?\s*/i, '').trim();
                    body = stripRrbMetadataAndNoise(body);

                    // Fix interleaved "हल:" when PDF column layout puts "हल:" between (A) and (B)/(C)/(D)
                    body = body.replace(/(?:^|\n)\s*[|।]?\s*(?:व्याख्या|हल|Solution)\s*[ः:\-]\s*\n(\s*\([B-D]\)\s*[^\n]+)/gi, '\n$1\nहल: ');

                    let solText = '';
                    // Split at "हल:" / "हलः" / "| हलः" / "। हलः" / "- हल:"
                    const solSplit = body.split(/(?:^|\n|\s|[|।])\s*[-\u2013\u2014•*👉|।]*\s*(?:व्याख्या|हल|Solution|Sol|Explanation)\s*[ः:\-]\s*/i);
                    if (solSplit.length > 1) {
                        let rawSol = solSplit.slice(1).join(' ').trim();
                        let beforeSol = solSplit[0].trim();

                        // Rescue any options (B), (C), (D) that were pushed below the first line of "हल:" due to PDF Y-sorting (e.g. Q.10, Q.61)
                        const solLines = rawSol.split('\n');
                        const keptSolLines = [];
                        for (const sLine of solLines) {
                            if (/^\s*\(\s*[A-D]\s*\)/i.test(sLine.trim()) && (!/\(\s*B\s*\)/i.test(beforeSol) || !/\(\s*C\s*\)/i.test(beforeSol) || !/\(\s*D\s*\)/i.test(beforeSol))) {
                                beforeSol += '\n' + sLine.trim();
                            } else {
                                keptSolLines.push(sLine);
                            }
                        }
                        rawSol = keptSolLines.join('\n').trim();

                        // Also if a line of solution (like "निर्धारित होता है, अतः विकल्प (A) सही है।") got placed right above "| हलः"
                        const beforeLines = beforeSol.split('\n');
                        if (beforeLines.length > 2) {
                            const lastBeforeLine = beforeLines[beforeLines.length - 1].trim();
                            if (/अतः\s*विकल्प\s*\([A-D]\)\s*सही\s*है/i.test(lastBeforeLine) && !/^\(\s*[A-D]\s*\)/i.test(lastBeforeLine)) {
                                rawSol = rawSol + ' ' + lastBeforeLine;
                                beforeLines.pop();
                                beforeSol = beforeLines.join('\n').trim();
                            }
                        }

                        solText = extractOnlyHindiText(rawSol) || rawSol;
                        body = beforeSol;
                    }

                    // Fix broken '(D)' label when 'विकल्प D [R1-R2]' and '(D)' are on adjacent lines (like Q.71)
                    body = body.replace(/\n\s*(विकल्प\s*D\b[^\n]*)\n\s*\(\s*D\s*\)/i, '\n(D) $1');

                    let qStem = body;
                    let options = null;
                    let detectedCorrectIdx = -1;

                    const ansSplit = body.split(/(?:^|\n|\s)Ans\s*(?=\[(?:GREEN_ANS(?::\d+)?|RED_OPT)\]|🟢|✅|[X✗×Χ✔☑☐]|[1-4]\s*[\.\)]|\(\s*[A-Da-d]\s*\)|\s|$)/i);
                    const stemCandidate = ansSplit.length > 1 ? ansSplit[0].trim() : body;
                    const optsRegion = ansSplit.length > 1 ? ansSplit.slice(1).join('\n').trim() : body;

                    const hasExplicitGreenBadge = (markerStr, rawSlice = '') => {
                        if (/🟢|✅|✔|✓|☑|💚|\[\s*स\s*ह\s*ी?\s*उ\s*(?:त्त|त|\s)*र\s*\]|\(\s*स\s*ह\s*ी?\s*उ\s*(?:त्त|त|\s)*र\s*\)|\[\s*Correct\s*Answer\s*\]/i.test(markerStr || '')) {
                            return true;
                        }
                        const trimmedSlice = String(rawSlice || '').replace(/\[(?:GREEN_ANS(?::\d+)?|RED_OPT)\]/g, '').trim();
                        if (/✓|✔|☑|🟢|✅|\[\s*स\s*ह\s*ी?\s*उ\s*(?:त्त|त|\s)*र\s*\]/i.test(trimmedSlice)) return true;
                        if (/(?<![a-zA-Z])\s*\/$/.test(trimmedSlice) && !/\b(?:km|m|s|hr|min|kg)\s*\/$/i.test(trimmedSlice)) {
                            return true;
                        }
                        return false;
                    };

                    const getGreenPixelScore = (markerStr) => {
                        if (!markerStr) return 0;
                        let totalScore = 0;
                        const matches = String(markerStr).matchAll(/\[GREEN_ANS(?::(\d+))?\]/g);
                        for (const m of matches) {
                            totalScore += (m[1] ? parseInt(m[1], 10) : 50);
                        }
                        return totalScore;
                    };

                    // Universal (A), (B), (C), (D) Option Extractor:
                    // Finds the last occurrence of (A), (B), (C), (D) option markers in the question block,
                    // even if PDF multi-column layout placed (D) before (A) or (B)/(C) on a wrapped line,
                    // and cleanly separates the Question Stem from the 4 Options!
                    const extractAbcdOptionsUniversally = (regionText) => {
                        const normRegion = '\n' + regionText.replace(/\r/g, '\n');
                        const optDefs = [
                            { letter: 'A', idx: 0, re: /(?:^|\n|\s)((?:(?<=^|\n)[ \t]*(?:🟢|✅|✔|✓|☑|💚|🔴|❌)[ \t]*)*)(?:\(\s*[Aaअ]\s*\)|(?<=^|\n)\s*[Aa]\s*[\.\)\:])\s*/g },
                            { letter: 'B', idx: 1, re: /(?:^|\n|\s)((?:(?<=^|\n)[ \t]*(?:🟢|✅|✔|✓|☑|💚|🔴|❌)[ \t]*)*)(?:\(\s*[Bbब]\s*\)|(?<=^|\n)\s*[Bb]\s*[\.\)\:])\s*/g },
                            { letter: 'C', idx: 2, re: /(?:^|\n|\s)((?:(?<=^|\n)[ \t]*(?:🟢|✅|✔|✓|☑|💚|🔴|❌)[ \t]*)*)(?:\(\s*[Ccस]\s*\)|(?<=^|\n)\s*[Cc]\s*[\.\)\:])\s*/g },
                            { letter: 'D', idx: 3, re: /(?:^|\n|\s)((?:(?<=^|\n)[ \t]*(?:🟢|✅|✔|✓|☑|💚|🔴|❌)[ \t]*)*)(?:\(\s*[Ddद]\s*\)|(?<=^|\n)\s*[Dd]\s*[\.\)\:])\s*/g }
                        ];

                        const foundOpts = [];
                        for (const def of optDefs) {
                            const allMatches = [...normRegion.matchAll(def.re)];
                            if (allMatches.length === 0) return null;
                            // Pick the last match in the block (so "(A)" in Assertion-Reason stem is ignored in favor of the actual option "(A)")
                            const m = allMatches[allMatches.length - 1];
                            foundOpts.push({
                                letter: def.letter,
                                optIdx: def.idx,
                                marker: m[1] || '',
                                matchIndex: m.index,
                                contentStart: m.index + m[0].length
                            });
                        }

                        // Sort by appearance position in text so we slice each option cleanly up to the next option marker
                        const byPos = [...foundOpts].sort((a, b) => a.matchIndex - b.matchIndex);
                        const firstOptStart = byPos[0].matchIndex;
                        let beforeOpts = normRegion.slice(0, firstOptStart).trim();

                        // If part of the question sentence wrapped after an option (e.g. Q.25 "पर निर्भर करती है।", Q.93 "होता है।", Q.99 "है।"),
                        // keep short trailing sentence endings or move them if needed, while keeping options clean
                        const rawOpts = ['', '', '', ''];
                        const markers = ['', '', '', ''];
                        const rawSlices = ['', '', '', ''];

                        for (let k = 0; k < 4; k++) {
                            const cur = byPos[k];
                            const end = k < 3 ? byPos[k + 1].matchIndex : normRegion.length;
                            let slice = normRegion.slice(cur.contentStart, end).trim();

                            // If a wrapped question fragment like "पर निर्भर करती है।" or "के रूप में दर्शाया जाता है।" is on a separate line inside an option, append it to question stem!
                            const sliceLines = slice.split('\n').map(l => l.trim()).filter(Boolean);
                            if (sliceLines.length > 1) {
                                const keptOptLines = [];
                                for (let sIdx = 0; sIdx < sliceLines.length; sIdx++) {
                                    const sl = sliceLines[sIdx];
                                    const cleanSl = sl.replace(/\[(?:GREEN_ANS(?::\d+)?|RED_OPT)\]/g, '').trim();
                                    if (sIdx > 0 && /^(?:पर\s+निर्भर\s+करती\s+है|के\s+रूप\s+में(?:\s+दर्शाया\s+जाता\s+है)?|दर्शाया\s+जाता\s+है|के\s+आधार\s+पर\s+रेटिंग\s+दी\s+जाती\s+है|साइड\s+पर\s+इंगित\s+किया\s+जाता\s+है|सह्यता\s+को\s+निरूपित\s+करता\s+है|ट्यूब\s+पर\s+कार्बन\s+फिल्म.*जमा\s+की\s+जाती\s+है|होता\s+है|होती\s+है|है)[।.]?$/.test(cleanSl)) {
                                        beforeOpts += ' ' + cleanSl;
                                    } else {
                                        keptOptLines.push(sl);
                                    }
                                }
                                slice = keptOptLines.join(' ').trim();
                            }

                            const inlineTags = (slice.match(/\[(?:GREEN_ANS(?::\d+)?|RED_OPT)\]|🟢|✅|✔|✓|☑|💚|\[\s*स\s*ह\s*ी?\s*उ\s*(?:त्त|त|\s)*र\s*\]|\(\s*स\s*ह\s*ी?\s*उ\s*(?:त्त|त|\s)*र\s*\)|\[\s*Correct\s*Answer\s*\]/gi) || []).join(' ');
                            rawSlices[cur.optIdx] = slice;
                            markers[cur.optIdx] = (cur.marker + ' ' + inlineTags).trim();
                            rawOpts[cur.optIdx] = cleanOptionHindiPreferred(slice);
                        }

                        return {
                            beforeOpts,
                            rawOpts,
                            markers,
                            rawSlices
                        };
                    };

                    const extractFourOptionsSequentially = (regionText) => {
                        const normRegion = '\n' + regionText.replace(/\r/g, '\n');
                        const positions = [];

                        for (let num = 1; num <= 4; num++) {
                            const searchStart = positions.length > 0 ? positions[positions.length - 1].contentStart : 0;
                            const sub = normRegion.slice(searchStart);
                            const re = new RegExp(`(?:^|\\n|\\s)((?:\\[(?:GREEN_ANS(?::\\d+)?|RED_OPT)\\]\\s*|(?:🟢|✅|✔|✓|☑|💚|🔴|❌|✗|✘|X|×|Χ|☐|•|\\*)\\s*)*)(?:\\(\\s*${num}\\s*\\)|${num}\\s*(?:\\.|\\)))\\s*`, 'i');
                            let m = sub.match(re);

                            if (!m) {
                                const reFallback = new RegExp(`(?:^|\\n)\\s*((?:\\[(?:GREEN_ANS(?::\\d+)?|RED_OPT)\\]\\s*|(?:🟢|✅|✔|✓|☑|💚|🔴|❌|✗|✘|X|×|Χ|☐|•|\\*)\\s*)*)${num}(?:\\s+|(?=\\d))`, 'i');
                                m = sub.match(reFallback);
                            }

                            if (!m) return null;
                            const matchIndex = searchStart + m.index;
                            const contentStart = matchIndex + m[0].length;
                            positions.push({
                                num,
                                marker: m[1] || '',
                                matchIndex,
                                contentStart
                            });
                        }

                        const rawOpts = [];
                        const markers = [];
                        const rawSlices = [];
                        for (let i = 0; i < 4; i++) {
                            const start = positions[i].contentStart;
                            const end = i < 3 ? positions[i + 1].matchIndex : normRegion.length;
                            const slice = normRegion.slice(start, end).trim();
                            const combinedMarker = positions[i].marker + ' ' + (slice.match(/\[(?:GREEN_ANS(?::\d+)?|RED_OPT)\]|🟢|✅|✔|✓|☑|💚|\[\s*स\s*ह\s*ी?\s*उ\s*(?:त्त|त|\s)*र\s*\]|\(\s*स\s*ह\s*ी?\s*उ\s*(?:त्त|त|\s)*र\s*\)/gi) || []).join(' ');
                            rawSlices.push(slice);
                            markers.push(combinedMarker);
                            rawOpts.push(cleanOptionHindiPreferred(slice));
                        }

                        return {
                            beforeOpts: normRegion.slice(0, positions[0].matchIndex).trim(),
                            rawOpts,
                            markers,
                            rawSlices
                        };
                    };

                    const abcdResult = extractAbcdOptionsUniversally(optsRegion);
                    const seqResult = abcdResult || extractFourOptionsSequentially(optsRegion);

                    const optLetters = ['A', 'B', 'C', 'D'];
                    let explicitBadgeFound = false;

                    if (seqResult && seqResult.rawOpts.length === 4) {
                        qStem = ansSplit.length > 1 ? stemCandidate : seqResult.beforeOpts;
                        options = seqResult.rawOpts;
                        const markers = seqResult.markers;
                        const rawSlices = seqResult.rawSlices || [];

                        // Priority 1: Explicit Checkmark / Green Badge (✓, ✔, 🟢, [सही उत्तर], or trailing '/' checkmark glyph)
                        const explicitBadgeIdx = markers.findIndex((m, idx) => hasExplicitGreenBadge(m, rawSlices[idx]));
                        if (explicitBadgeIdx !== -1) {
                            detectedCorrectIdx = explicitBadgeIdx;
                            explicitBadgeFound = true;
                        } else {
                            // Priority 2: Canvas Green Ink Pixel Score ([GREEN_ANS:score])
                            const greenScores = markers.map(m => getGreenPixelScore(m));
                            const maxGreenScore = Math.max(...greenScores);
                            if (maxGreenScore > 0) {
                                detectedCorrectIdx = greenScores.indexOf(maxGreenScore);
                            } else {
                                // Priority 3: 3 Red Crosses -> remaining 1 is correct
                                const isWrong = markers.map(m => m.includes('[RED_OPT]') || /[X✗✘❌×Χ]/i.test(m));
                                if (isWrong.filter(Boolean).length === 3) {
                                    detectedCorrectIdx = isWrong.indexOf(false);
                                }
                            }
                        }
                    }

                    // Priority 4: Solution ("हलः") Verification & Resolver
                    let solMatchedLetter = null;
                    if (solText && options && options.length === 4) {
                        solMatchedLetter = matchOptionFromSolutionText(solText, options, qStem);
                    }

                    let ansLetter = null;
                    if (explicitBadgeFound && detectedCorrectIdx !== -1) {
                        ansLetter = optLetters[detectedCorrectIdx];
                    } else if (solMatchedLetter) {
                        ansLetter = solMatchedLetter;
                    } else if (detectedCorrectIdx !== -1) {
                        ansLetter = optLetters[detectedCorrectIdx];
                    }

                    if (!ansLetter) {
                        const explicitAnsMatch = body.match(/(?:^|\n)\s*(?:सही\s*(?:उत्तर|विकल्प)|उत्तर|Ans(?:wer)?|Correct\s*(?:Option|Answer))\s*[:\-\=]\s*\(?([A-Da-d1-4अ-द])\)?(?=\s|$)/i);
                        if (explicitAnsMatch) {
                            const rawA = explicitAnsMatch[1].toUpperCase();
                            const mapCode = { '1': 'A', '2': 'B', '3': 'C', '4': 'D', 'अ': 'A', 'ब': 'B', 'स': 'C', 'द': 'D' };
                            ansLetter = mapCode[rawA] || rawA;
                        }
                    }

                    if (!ansLetter) ansLetter = 'A';

                    // Strip any residual option text from qStem so options NEVER appear in the question box
                    const cleanedStem = qStem
                        .replace(/\[(?:GREEN_ANS(?::\d+)?|RED_OPT)\]/g, '')
                        .replace(/\(\s*[A-Da-d]\s*\)\s*[^\n]+/g, '')
                        .trim();
                    const hindiQuestionOnly = extractOnlyHindiText(cleanedStem);
                    if (!hindiQuestionOnly || hindiQuestionOnly.length < 3) return;

                    if (!options || options.length < 4) {
                        options = ['विकल्प A', 'विकल्प B', 'विकल्प C', 'विकल्प D'];
                    } else {
                        options = options.map((o, i) => o || `विकल्प ${optLetters[i]}`);
                    }

                    const finalAns = ['A', 'B', 'C', 'D'].includes(ansLetter) ? ansLetter : 'A';
                    const cleanedQHi = fixBrokenHindiText(hindiQuestionOnly);
                    const cleanedOpts = options.map(o => fixBrokenHindiText(o));
                    const autoSol = solText
                        ? fixBrokenHindiText(solText)
                        : generateDetailedHindiSolution({
                            questionHi: cleanedQHi,
                            options: cleanedOpts,
                            answer: finalAns
                        });

                    parsed.push({
                        id: Date.now() + parsed.length + 1,
                        section: subCategory || 'RRB ALP PYQ',
                        questionHi: cleanedQHi,
                        options: cleanedOpts,
                        answer: finalAns,
                        solution: autoSol,
                        image: ''
                    });
                });

                return parsed;
            };

            const handlePdfUpload = async (e) => {
                const file = e.target.files[0];
                if (!file) return;
                setExtracting(true);
                setExtractStatus(`PDF "${file.name}" पढ़ा जा रहा है...`);
                setMsg({ text: `PDF "${file.name}" से सभी शुद्ध हिन्दी प्रश्न, चारों विकल्प और 100% सटीक सही उत्तर (Green) निकाले जा रहे हैं...`, type: 'info' });

                try {
                    const pdfjsLib = await loadPdfJsScript();
                    const arrayBuf = await file.arrayBuffer();
                    const pdfDoc = await pdfjsLib.getDocument({
                        data: arrayBuf,
                        cMapUrl: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/cmaps/',
                        cMapPacked: true,
                        standardFontDataUrl: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/standard_fonts/'
                    }).promise;
                    let fullText = '';

                    const maxPages = Math.min(pdfDoc.numPages, 100);
                    const offscreenCanvas = document.createElement('canvas');
                    const offscreenCtx = offscreenCanvas.getContext('2d', { willReadFrequently: true });

                    for (let p = 1; p <= maxPages; p++) {
                        setExtractStatus(`पेज ${p} / ${maxPages} से हिन्दी प्रश्न व Green Answer स्कैन हो रहे हैं...`);
                        const page = await pdfDoc.getPage(p);
                        const scale = 1.5;
                        const viewport = page.getViewport({ scale });
                        offscreenCanvas.width = Math.ceil(viewport.width);
                        offscreenCanvas.height = Math.ceil(viewport.height);

                        let imgData = null;
                        try {
                            await page.render({ canvasContext: offscreenCtx, viewport }).promise;
                            imgData = offscreenCtx.getImageData(0, 0, offscreenCanvas.width, offscreenCanvas.height);
                        } catch (renderErr) {}

                        // Pure Green Ink Detector for PDF Text Items:
                        // Detects true green font ink (R < 170, G >= 60, G > R + 22, G > B + 18) strictly inside the glyph box
                        // so green borders/backgrounds of adjacent solution boxes NEVER cause false positives!
                        const detectItemColorTag = (it, checkLeftIcon = false) => {
                            if (!imgData || !it || !it.str || !it.str.trim()) return '';
                            const fontSize = it.fontSize || 10;
                            const itemW = Math.max(it.w || 0, it.str.trim().length * fontSize * 0.42, 8);
                            const pdfXStart = checkLeftIcon ? (it.x - 18) : it.x;
                            const pdfXEnd = it.x + itemW;
                            const safeBottomPdfY = it.y + 0.5;
                            const safeTopPdfY = it.y + fontSize * 0.80;

                            const [cx1, cyBottom] = viewport.convertToViewportPoint(pdfXStart, safeBottomPdfY);
                            const [cx2, cyTop] = viewport.convertToViewportPoint(pdfXEnd, safeTopPdfY);

                            const xStart = Math.max(0, Math.floor(Math.min(cx1, cx2)));
                            const xEnd = Math.min(offscreenCanvas.width - 1, Math.ceil(Math.max(cx1, cx2)));
                            const yStart = Math.max(0, Math.floor(Math.min(cyBottom, cyTop)));
                            const yEnd = Math.min(offscreenCanvas.height - 1, Math.ceil(Math.max(cyBottom, cyTop)));

                            let greenCount = 0;
                            let redCount = 0;
                            const data = imgData.data;
                            const w = offscreenCanvas.width;

                            for (let py = yStart; py <= yEnd; py++) {
                                for (let px = xStart; px <= xEnd; px++) {
                                    const idx = (py * w + px) * 4;
                                    const r = data[idx];
                                    const g = data[idx + 1];
                                    const b = data[idx + 2];
                                    // True Green Font Ink / Green Checkmark ✔ / 🟢
                                    if (g >= 60 && r < 175 && g > r + 22 && g > b + 18) {
                                        greenCount++;
                                    }
                                    // True Red Font Ink / Red Cross ✗ / ❌
                                    else if (r > 125 && g < 160 && r > g + 32 && r > b + 28) {
                                        redCount++;
                                    }
                                }
                            }

                            if (greenCount >= 4 && greenCount > redCount * 1.3) return `[GREEN_ANS:${greenCount}] `;
                            if (redCount >= 8 && redCount > greenCount * 1.5) return '[RED_OPT] ';
                            return '';
                        };

                        const textContent = await page.getTextContent();
                        const rows = [];
                        for (const item of textContent.items) {
                            if (item.str === undefined || item.str === null || item.str === '') continue;
                            const x = item.transform ? item.transform[4] : 0;
                            const y = item.transform ? item.transform[5] : 0;
                            const fontSize = item.transform ? Math.abs(item.transform[0] || item.transform[3] || 10) : 10;
                            const w = item.width !== undefined ? item.width : (item.str.length * fontSize * 0.45);

                            // Smart Row Grouping:
                            // 1. Direct match if within 4.2pt vertically.
                            // 2. If within 8.5pt vertically AND X-intervals do not overlap (e.g. side-by-side options (A), (B), (C), (D) or math superscripts on the same line), merge into the same row!
                            let targetRow = rows.find(r => Math.abs(r.y - y) <= 4.2);
                            if (!targetRow && item.str.trim()) {
                                targetRow = rows.find(r => {
                                    if (Math.abs(r.y - y) > 8.5) return false;
                                    const x1 = x;
                                    const x2 = x + Math.max(w, 6);
                                    const hasXOverlap = r.items.some(existing => {
                                        if (!existing.str.trim()) return false;
                                        const ex1 = existing.x;
                                        const ex2 = existing.x + Math.max(existing.w, 6);
                                        return Math.min(x2, ex2) - Math.max(x1, ex1) > 4;
                                    });
                                    return !hasXOverlap;
                                });
                            }

                            if (!targetRow) {
                                targetRow = { y, items: [] };
                                rows.push(targetRow);
                            }
                            targetRow.items.push({ str: item.str, x, y, w, fontSize, hasEOL: !!item.hasEOL });
                        }

                        rows.sort((a, b) => b.y - a.y);

                        const metaZoneRe = /^(?:Question\s*Type|Question\s*ID|Option\s*[1-4]\s*ID|Status|Chosen\s*Option|Not\s*Attempted|Marked\s*For\s*Review|Not\s*Answered|Answered)\b/i;
                        const watermarkRe = /^(?:SCIENCE|MAGNET|SCIENC|MAGNE|MAGN|SCIE|AGN|INDIAN\s*RAILWAY)$/i;
                        const isSolutionLineRe = /^(?:\|?\s*(?:हल|व्याख्या|Solution)\s*[ः:\-])/i;

                        let pageLines = [];
                        for (let rIdx = 0; rIdx < rows.length; rIdx++) {
                            const row = rows[rIdx];
                            row.items.sort((a, b) => a.x - b.x);

                            let cleanItems = [];
                            for (const it of row.items) {
                                const t = it.str.trim();
                                if (t && watermarkRe.test(t)) continue;
                                if (t && (metaZoneRe.test(t) || /^441009\d{6}$/.test(t))) break;
                                cleanItems.push(it);
                            }
                            if (cleanItems.length === 0) continue;

                            // Check if this row is a "हल:" line so we don't tag solution text as a green option
                            const rawRowPreview = cleanItems.map(ci => ci.str).join(' ').trim();
                            const isSolRow = isSolutionLineRe.test(rawRowPreview);

                            let lineStr = '';
                            let lastEndX = null;
                            let seenSolutionInRow = isSolRow;

                            for (let cIdx = 0; cIdx < cleanItems.length; cIdx++) {
                                const it = cleanItems[cIdx];
                                const rawCleaned = String(it.str || '').replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F\u007F-\u009F\u00AD\u200B-\u200F\uE000-\uF8FF\uFEFF\uFFF0-\uFFFF]/g, '');
                                if (!rawCleaned) continue;
                                if (!rawCleaned.trim()) {
                                    if (lineStr.length > 0 && !lineStr.endsWith(' ')) lineStr += ' ';
                                    if (it.w > 0) lastEndX = it.x + it.w;
                                    continue;
                                }

                                const cleanedItemStr = fixBrokenHindiText(rawCleaned);
                                if (!cleanedItemStr) continue;

                                if (/(?:^|\s|\|)(?:हल|व्याख्या)\s*[ः:\-]/.test(cleanedItemStr)) {
                                    seenSolutionInRow = true;
                                }

                                if (lastEndX !== null) {
                                    const gap = it.x - lastEndX;
                                    const prevChar = lineStr.slice(-1);
                                    const nextChar = cleanedItemStr.charAt(0);
                                    const isMatraOrHalant = /[\u0901-\u0903\u093C\u093E-\u094D]/.test(nextChar) || prevChar === '\u094D';
                                    const spaceThreshold = Math.max(1.8, it.fontSize * 0.18);
                                    if (!isMatraOrHalant && gap > spaceThreshold && !lineStr.endsWith(' ') && !cleanedItemStr.startsWith(' ')) {
                                        lineStr += ' ';
                                    }
                                }

                                // Detect green/red color directly on this specific PDF item and place tag AFTER the item text so it stays inside its own option slice
                                let itemTag = '';
                                if (!seenSolutionInRow && imgData && !/^Ans$/i.test(cleanedItemStr.trim())) {
                                    const canCheckLeftIcon = (cIdx === 0 || (lastEndX !== null && (it.x - lastEndX) > 16)) &&
                                        /^(?:Ans\s*)?(?:\(\s*[A-Da-d1-4]\s*\)|[1-4A-Da-d]\s*[\.\)])/i.test(cleanedItemStr.trim());
                                    itemTag = detectItemColorTag(it, canCheckLeftIcon);
                                }

                                lineStr += cleanedItemStr + (itemTag ? ' ' + itemTag : '');
                                lastEndX = it.x + Math.max(0, it.w);
                            }

                            lineStr = lineStr.replace(/[ \t]{2,}/g, ' ').trim();
                            if (!lineStr) continue;

                            lineStr = lineStr.replace(/^(Ans)\s*([X✗×Χ✔☑☐🟢✅]?\s*(?:\(?[1-4A-Da-d]\)?[\.\)]?))/i, '$1 $2');
                            lineStr = lineStr.replace(/^((?:Ans\s+)?[X✗×Χ✔☑☐🟢✅]?\s*(?:\([1-4A-Da-d]\)|[1-4A-Da-d][\.\)]))(\S)/i, '$1 $2');

                            pageLines.push(lineStr);
                        }

                        fullText += `\n${pageLines.join('\n')}\n`;
                    }

                    const extractedQs = parseHindiQuestionsFromText(fullText);
                    const cleanPreviewText = extractedQs.map((q, idx) =>
                        `प्र.${idx + 1} ${q.questionHi}\n(A) ${q.options[0]} (B) ${q.options[1]} (C) ${q.options[2]} (D) ${q.options[3]}\nसही उत्तर (Green): ${q.answer}`
                    ).join('\n\n');
                    setRawTextInput(cleanPreviewText || stripRrbMetadataAndNoise(fullText));

                    if (extractedQs.length > 0) {
                        setTbQuestions(extractedQs);
                        setMsg({ text: `सफलतापूर्वक ${extractedQs.length} शुद्ध हिन्दी प्रश्न, चारों विकल्प और हरे रंग (Green) वाले सही उत्तर ऑटोमैटिक सेट कर दिए गए हैं!`, type: 'success' });
                    } else {
                        setMsg({ text: 'PDF में यूनिकोड हिन्दी प्रश्न नहीं मिले।', type: 'error' });
                    }
                } catch (err) {
                    setMsg({ text: `PDF पढ़ने में त्रुटि: ${err.message}`, type: 'error' });
                } finally {
                    setExtracting(false);
                    setExtractStatus('');
                }
            };

            const handleParseRawText = () => {
                if (!rawTextInput.trim()) {
                    setMsg({ text: 'कृपया पहले PDF अपलोड करें या नीचे बॉक्स में हिन्दी प्रश्न पेस्ट करें।', type: 'error' });
                    return;
                }
                const parsed = parseHindiQuestionsFromText(rawTextInput);
                if (parsed.length > 0) {
                    setTbQuestions(parsed);
                    setMsg({ text: `${parsed.length} शुद्ध हिन्दी प्रश्न, चारों विकल्प और सही उत्तर सफलतापूर्वक सेट हो गए!`, type: 'success' });
                } else {
                    setMsg({ text: 'कोई हिन्दी प्रश्न नहीं मिला।', type: 'error' });
                }
            };

            const handleAppendPastedQuestions = () => {
                if (!rawTextInput.trim()) return;
                const parsed = parseHindiQuestionsFromText(rawTextInput);
                if (parsed.length > 0) {
                    setTbQuestions(prev => [...prev, ...parsed]);
                    setRawTextInput('');
                    setMsg({ text: `बाहर से पेस्ट किए गए ${parsed.length} नए प्रश्न जोड़ दिए गए हैं!`, type: 'success' });
                }
            };

            const handleClipboardPasteToBox = async () => {
                try {
                    const clipText = await navigator.clipboard.readText();
                    if (clipText) {
                        const cleanedClip = fixBrokenHindiText(stripRrbMetadataAndNoise(clipText));
                        setRawTextInput(prev => prev ? `${prev}\n\n${cleanedClip}` : cleanedClip);
                        setMsg({ text: 'Clipboard से प्रश्न और विकल्प पेस्ट करके हिन्दी शुद्ध कर दी गई है!', type: 'success' });
                    }
                } catch (err) {}
            };

            const handlePasteIntoSingleQuestion = async (idx) => {
                try {
                    const clipText = await navigator.clipboard.readText();
                    if (!clipText || !clipText.trim()) return;

                    if (parsed.length > 0) {
                        setTbQuestions(prev => {
                            const arr = [...prev];
                            arr[idx] = { ...arr[idx], ...parsed[0], id: arr[idx].id };
                            return arr;
                        });
                        setMsg({ text: `प्रश्न ${idx + 1} में बाहर से प्रश्न और उत्तर पेस्ट कर दिए गए!`, type: 'success' });
                    }
                } catch (err) {}
            };

            const addBlankQuestion = () => {
                setTbQuestions(prev => [
                    ...prev,
                    {
                        id: Date.now(),
                        section: subCategory || 'RRB ALP PYQ',
                        questionHi: 'नया आरआरबी एएलपी हिन्दी प्रश्न यहाँ लिखें?',
                        options: ['विकल्प A', 'विकल्प B', 'विकल्प C', 'विकल्प D'],
                        answer: 'A',
