                        image: ''
                    }
                ]);
            };

            const buildCurrentPreviewConfig = () => {
                const compiledHtml = createTestbookPdfTestHtml({
                    title,
                    timeInSeconds: (parseInt(time) || 60) * 60,
                    tbQuestions,
                    positiveMarks: parseFloat(positiveMarks) || 1.0,
                    negativeMarks: parseFloat(negativeMarks) || 0.33
                });
                return {
                    title,
                    category: 'RRB_PYQ',
                    subCategory: subCategory || 'RRB ALP PYQ',
                    questions: tbQuestions.length,
                    time: `${time || 60} Min`,
                    timeInSeconds: (parseInt(time) || 60) * 60,
                    numParts: 1,
                    testTypeId: TEST_TYPES.CUSTOM_HTML,
                    rawHtml: compiledHtml
                };
            };

            const handlePublishPdfTest = async () => {
                if (!firebaseMethods || !firebaseReady) return;
                setPublishing(true);
                setMsg({ text: 'RRB PYQ TEST सेक्शन में टेस्ट पब्लिश किया जा रहा है...', type: 'info' });
                try {
                    const draft = buildCurrentPreviewConfig();
                    const safeUUID = (window.crypto && window.crypto.randomUUID) ? window.crypto.randomUUID() : Date.now().toString();
                    const testId = `custom_rrb_pyq_${safeUUID}`;
                    const newTest = {
                        ...draft,
                        id: testId,
                        createdAt: firebaseMethods.serverTimestamp(),
                        updatedAt: firebaseMethods.serverTimestamp()
                    };
                    const testDocRef = getCustomTestDoc(firebaseMethods, firebaseDb, appId, testId);
                    await firebaseMethods.setDocFunc(testDocRef, newTest);
                    setMsg({ text: 'सफलता! यह टेस्ट अब बाईं तरफ "RRB PYQ TEST" सेक्शन में जुड़ गया है!', type: 'success' });
                    setTimeout(() => onTestAdded(newTest), 900);
                } catch (err) {
                    setMsg({ text: `Publish Failed: ${err.message}`, type: 'error' });
                } finally {
                    setPublishing(false);
                }
            };

            if (showLivePreview) {
                const previewCfg = buildCurrentPreviewConfig();
                return (
                    <div className="w-full h-full flex flex-col absolute inset-0 z-50 bg-slate-900 animate-fade-in">
                        <div className="h-14 bg-[#0f172a] text-white flex items-center justify-between px-6 border-b border-slate-700 shrink-0">
                            <button onClick={() => setShowLivePreview(false)} className="bg-slate-700 hover:bg-slate-600 px-4 py-1.5 rounded-lg font-bold text-sm">
                                <i className="fa-solid fa-arrow-left mr-2"></i> वापस एडिटर पर जाएं
                            </button>
                            <div className="text-sm font-black text-sky-400">
                                <i className="fa-solid fa-desktop mr-2"></i> RRB PYQ TEST (शुद्ध हिन्दी) Live Preview ({tbQuestions.length} प्रश्न)
                            </div>
                            <button onClick={() => { setShowLivePreview(false); handlePublishPdfTest(); }} className="bg-emerald-600 hover:bg-emerald-500 text-white px-5 py-1.5 rounded-lg font-black text-sm shadow">
                                RRB PYQ TEST में पब्लिश करें <i className="fa-solid fa-cloud-arrow-up ml-1.5"></i>
                            </button>
                        </div>
                        <div className="flex-1 relative">

                    <div className="bg-gradient-to-r from-[#0f172a] via-[#1e1b4b] to-[#0284c7] text-white p-6 rounded-2xl shadow-xl flex flex-col md:flex-row items-start md:items-center justify-between gap-6">
                        <div className="flex items-center gap-4">
                            <div className="w-14 h-14 rounded-2xl bg-sky-400/20 border border-sky-300/40 flex items-center justify-center text-3xl text-sky-300 shrink-0">
                                <i className="fa-solid fa-file-pdf"></i>
                            </div>
                            <div>
                                <span className="bg-amber-400/20 border border-amber-300/40 text-amber-200 text-[11px] font-black px-3 py-0.5 rounded-full uppercase tracking-wider">
                                    सिर्फ हिन्दी प्रश्न • 4 विकल्प • सही उत्तर • RRB PYQ TEST में जुड़ेगा
                                </span>
                                <h2 className="text-2xl font-black mt-1">Test Generator Simulator (RRB PYQ PDF — शुद्ध हिन्दी)</h2>
                                <p className="text-sky-100 text-xs font-medium mt-0.5">
                                    PDF से सिर्फ और सिर्फ हिन्दी के प्रश्न, चारों विकल्प (A, B, C, D) और सही उत्तर निकालकर सीधे "RRB PYQ TEST" में जोड़ें।
                                </p>
                            </div>
                        </div>
                        <div className="flex flex-wrap gap-3 shrink-0">
                            <button type="button" onClick={() => setShowLivePreview(true)} className="bg-amber-500 hover:bg-amber-400 text-slate-950 font-black px-5 py-3 rounded-xl shadow-lg flex items-center gap-2 text-sm">
                                <i className="fa-solid fa-eye"></i> Live Preview देखें
                            </button>
                            <button type="button" onClick={handlePublishPdfTest} disabled={publishing || !firebaseReady} className="bg-emerald-500 hover:bg-emerald-400 text-white font-black px-6 py-3 rounded-xl shadow-lg flex items-center gap-2 text-sm disabled:opacity-50">

                    {msg.text && (

                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">

        const TestUploaderView = ({ firebaseMethods, firebaseDb, appId, onTestAdded, firebaseReady }) => {
            const [title, setTitle] = useState('');
            const [category, setCategory] = useState('Observation');
            const [numParts, setNumParts] = useState('3'); 
            const [questions, setQuestions] = useState('');
            const [time, setTime] = useState('');
            const [file, setFile] = useState(null);
            
            const [loading, setLoading] = useState(false);
            const [msg, setMsg] = useState({ text: '', type: '' });
            
            const [parsedContent, setParsedContent] = useState(null);
            const [showPreview, setShowPreview] = useState(false);

            const handleParseAndPreview = async (e) => {
                e.preventDefault();
                if (!file) return;
                setLoading(true);
                setMsg({ text: 'Executing Universal Smart Parsing & HTML Sanitization...', type: 'info' });

                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const rawHtml = event.target.result;
                        let extractedElements = [];

                        const stripStyles = (str) => {
                            if (typeof str !== 'string') return str;
                            return str.replace(/<style\b[^>]*>([\s\S]*?)<\/style>/gi, '').replace(/<script\b[^>]*>([\s\S]*?)<\/script>/gi, '');
                        };

                        const parser = new DOMParser();
                        const doc = parser.parseFromString(rawHtml, 'text/html');
                        doc.querySelectorAll('style, script').forEach(s => s.remove());

                        const radios = Array.from(doc.querySelectorAll('input[type="radio"]'));
                        const radioGroups = {};
                        radios.forEach(r => {
                            if(!radioGroups[r.name]) radioGroups[r.name] = [];
                            radioGroups[r.name].push(r);
                        });

                        const uniqueWrappers = new Set();
                        Object.values(radioGroups).forEach(group => {
                            if (group.length > 0) {
                                let wrapper = group[0].closest('.q-row, .question, .question-container, .mcq-item, tr');
                                if (wrapper) uniqueWrappers.add(wrapper);
                            }
                        });

                        Array.from(uniqueWrappers).forEach(el => {
                            if (!el.classList.contains('q-row')) el.classList.add('q-row');
                            el.innerHTML = stripStyles(el.innerHTML);
                            extractedElements.push(el.outerHTML);
                        });

                        if (extractedElements.length === 0) {
                            throw new Error("No valid test questions found in the uploaded file.");
                        }

                        const testConfigDraft = {
                            title,
                            category,
                            questions: parseInt(questions) || extractedElements.length,
                            time: `${time} Min`,
                            timeInSeconds: parseInt(time) * 60 || 240,
                            numParts: parseInt(numParts), 
                            testTypeId: TEST_TYPES.CUSTOM_HTML,
                            parsedQuestions: extractedElements, 
                        };
                        
                        setParsedContent(testConfigDraft);
                        setMsg({ text: `Successfully parsed ${extractedElements.length} questions.`, type: 'success' });
                    } catch (err) {
                        setMsg({ text: 'Parse Error: ' + err.message, type: 'error' });
                        setParsedContent(null);
                    }
                    setLoading(false);
                };
                reader.readAsText(file);
            };

            const handlePublish = async () => {
                if (!parsedContent || !firebaseMethods || !firebaseReady) return;
                setLoading(true);
                try {
                    const safeUUID = (window.crypto && window.crypto.randomUUID) ? window.crypto.randomUUID() : Date.now().toString();
                    const testId = `custom_${safeUUID}`;
                    const newTest = {
                        ...parsedContent,
                        id: testId,
                        createdAt: firebaseMethods.serverTimestamp(),
                        updatedAt: firebaseMethods.serverTimestamp()
                    };
                    const testDocRef = getCustomTestDoc(firebaseMethods, firebaseDb, appId, testId);
                    await firebaseMethods.setDocFunc(testDocRef, newTest);
                    setMsg({ text: 'Success: Test live on Cloud!', type: 'success' });
                    setTimeout(() => onTestAdded(newTest), 1000);
                } catch (err) {
                    setMsg({ text: `Publish Failed: ${err.message}`, type: 'error' });
                }
                setLoading(false);
            };

            if (showPreview && parsedContent) {
                return (
                    <div className="w-full h-full flex flex-col absolute inset-0 z-50 bg-slate-900 animate-fade-in">
                        <div className="h-16 bg-[#1e293b] text-white flex items-center justify-between px-6 shrink-0 z-50">
                            <button onClick={() => setShowPreview(false)} className="bg-slate-700 hover:bg-slate-600 px-4 py-2 rounded-lg font-bold">Back</button>

            const loadCheckout = () => new Promise((resolve, reject) => {
                if (window.Razorpay) return resolve();
                const script = document.createElement('script'); script.src = 'https://checkout.razorpay.com/v1/checkout.js'; script.async = true;
                script.onload = resolve; script.onerror = () => reject(new Error('Razorpay Checkout load नहीं हो सका।')); document.head.appendChild(script);
            });

                setSubmitting(true); setSettingsError('');

                    await loadCheckout();

                    if (!order?.orderId || !order?.keyId || !order?.amount) throw new Error('Razorpay Order response अधूरा है।');
                    const checkout = new window.Razorpay({
                        key: order.keyId, amount: order.amount, currency: order.currency || 'INR', name: 'Unlimited Gyan Test',

                        prefill: { name: studentName || userAuth.displayName || '', email: userAuth.email || '' }, theme: { color: '#1e1b4b' },
                        handler: async (r) => {

                            } catch (e) { setSettingsError(e?.message || 'Payment Verify नहीं हो सका।'); }
                            finally { setSubmitting(false); }
                        },
                        modal: { ondismiss: () => setSubmitting(false) }
                    });
                    checkout.on('payment.failed', r => { setSettingsError(r?.error?.description || 'Razorpay भुगतान असफल हुआ।'); setSubmitting(false); });
                    checkout.open();

            };
            return <div className="fixed inset-0 z-[200] bg-slate-900/75 backdrop-blur-sm flex items-center justify-center p-4"><div className="bg-white w-full max-w-2xl rounded-3xl shadow-2xl overflow-hidden max-h-[92vh] overflow-y-auto">

            const saveSettings = async e => {

                        if (document.exitFullscreen) {
                            document.exitFullscreen().catch(() => {});
                        } else if (document.webkitExitFullscreen) {
                            document.webkitExitFullscreen();
                        } else if (document.msExitFullscreen) {
                            document.msExitFullscreen();
                        }
                    }
                };

                const requestAppFullscreen = () => {
                    if (window._userExitedFullscreen) return;
                    const elem = document.documentElement;
                    if (!document.fullscreenElement && !document.webkitFullscreenElement && !document.msFullscreenElement) {
                        if (elem.requestFullscreen) {
                            elem.requestFullscreen({ navigationUI: 'hide' }).catch(() => {});
                        } else if (elem.webkitRequestFullscreen) {
                            elem.webkitRequestFullscreen();
                        } else if (elem.msRequestFullscreen) {
                            elem.msRequestFullscreen();
                        }
                    }
                };

                const handleKeyDown = (e) => {
                    if (e.key === 'Escape' || e.keyCode === 27) {
                        exitAppFullscreen();
                    }
                };

                const handleMessage = (event) => {
                    if (event.data && event.data.type === 'EXIT_FULLSCREEN') {
                        exitAppFullscreen();
                    } else if (event.data && event.data.type === 'FORCE_FULLSCREEN') {
                        window._userExitedFullscreen = false;
                        requestAppFullscreen();
                    }
                };

                const handleFullscreenChange = () => {

                    }
                };

                requestAppFullscreen();
                const pointerEvents = ['click', 'dblclick', 'mousedown', 'pointerdown', 'touchstart'];
                pointerEvents.forEach(evt => document.addEventListener(evt, requestAppFullscreen, { passive: true, capture: true }));

                document.addEventListener('fullscreenchange', handleFullscreenChange);
                window.addEventListener('message', handleMessage);

                return () => {

                const totalQs = selectedTest.questions || resultData.details.length || 1;

                                                        </div>
                                                        <div className="w-full h-2.5 bg-slate-200 rounded-full overflow-hidden">
                                                            <div className="h-full bg-sky-600 rounded-full" style={{ width: `${Math.min(100, Math.max(4, (netScore / maxMarks) * 100))}%` }}></div>
                                                        </div>
                                                    </div>
                                                    <div>
                                                        <div className="flex justify-between text-xs font-bold mb-1">
                                                            <span className="text-emerald-700">Topper (टॉपर)</span>
                                                            <span className="font-black">{topperScore} / {maxMarks}</span>
                                                        </div>
                                                        <div className="w-full h-2.5 bg-slate-200 rounded-full overflow-hidden">
                                                            <div className="h-full bg-emerald-500 rounded-full" style={{ width: '91%' }}></div>
                                                        </div>
                                                    </div>
                                                    <div>
                                                        <div className="flex justify-between text-xs font-bold mb-1">
                                                            <span className="text-amber-700">Average (औसत)</span>
                                                            <span className="font-black">{avgScore} / {maxMarks}</span>
                                                        </div>
                                                        <div className="w-full h-2.5 bg-slate-200 rounded-full overflow-hidden">
                                                            <div className="h-full bg-amber-500 rounded-full" style={{ width: '54%' }}></div>
                                                        </div>
                                                    </div>
                                                </div>

                                                {/* Accuracy Comparison */}
                                                <div className="p-4 rounded-xl bg-slate-50 border border-slate-200 space-y-3">
                                                    <div className="text-xs font-black text-slate-700 uppercase">Accuracy Comparison (सटीकता)</div>
                                                    <div>
                                                        <div className="flex justify-between text-xs font-bold mb-1">
                                                            <span className="text-sky-700">You (आप)</span>
                                                            <span className="font-black">{accuracy.toFixed(1)}%</span>
                                                        </div>
                                                        <div className="w-full h-2.5 bg-slate-200 rounded-full overflow-hidden">
                                                            <div className="h-full bg-sky-600 rounded-full" style={{ width: `${Math.min(100, Math.max(4, accuracy))}%` }}></div>
                                                        </div>
                                                    </div>
                                                    <div>
                                                        <div className="flex justify-between text-xs font-bold mb-1">
                                                            <span className="text-emerald-700">Topper (टॉपर)</span>
                                                            <span className="font-black">{topperAccuracy}%</span>
                                                        </div>
                                                        <div className="w-full h-2.5 bg-slate-200 rounded-full overflow-hidden">
                                                            <div className="h-full bg-emerald-500 rounded-full" style={{ width: `${topperAccuracy}%` }}></div>
                                                        </div>
                                                    </div>
                                                    <div>
                                                        <div className="flex justify-between text-xs font-bold mb-1">
                                                            <span className="text-amber-700">Average (औसत)</span>
                                                            <span className="font-black">{avgAccuracy}%</span>
                                                        </div>
                                                        <div className="w-full h-2.5 bg-slate-200 rounded-full overflow-hidden">
                                                            <div className="h-full bg-amber-500 rounded-full" style={{ width: `${avgAccuracy}%` }}></div>
                                                        </div>
                                                    </div>
                                                </div>

                                                {/* Correct Questions Comparison */}
                                                <div className="p-4 rounded-xl bg-slate-50 border border-slate-200 space-y-3">
                                                    <div className="text-xs font-black text-slate-700 uppercase">Correct Answers (सही प्रश्न)</div>
                                                    <div>
                                                        <div className="flex justify-between text-xs font-bold mb-1">
                                                            <span className="text-sky-700">You (आप)</span>
                                                            <span className="font-black">{correct} / {totalQs}</span>
                                                        </div>
                                                        <div className="w-full h-2.5 bg-slate-200 rounded-full overflow-hidden">
                                                            <div className="h-full bg-sky-600 rounded-full" style={{ width: `${Math.min(100, Math.max(4, (correct / totalQs) * 100))}%` }}></div>
                                                        </div>
                                                    </div>
                                                    <div>
                                                        <div className="flex justify-between text-xs font-bold mb-1">
                                                            <span className="text-emerald-700">Topper (टॉपर)</span>
                                                            <span className="font-black">{topperCorrect} / {totalQs}</span>
                                                        </div>
                                                        <div className="w-full h-2.5 bg-slate-200 rounded-full overflow-hidden">
                                                            <div className="h-full bg-emerald-500 rounded-full" style={{ width: '92%' }}></div>
                                                        </div>
                                                    </div>
                                                    <div>
                                                        <div className="flex justify-between text-xs font-bold mb-1">
                                                            <span className="text-amber-700">Average (औसत)</span>
                                                            <span className="font-black">{avgCorrect} / {totalQs}</span>
                                                        </div>
                                                        <div className="w-full h-2.5 bg-slate-200 rounded-full overflow-hidden">
                                                            <div className="h-full bg-amber-500 rounded-full" style={{ width: '61%' }}></div>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                );
                            })()}

                            {currentView === TEST_TYPES.SOLUTION && selectedTest && completedTests[selectedTest.id] && (
                                <SolutionViewer testConfig={selectedTest} result={completedTests[selectedTest.id]} onBack={() => setCurrentView(selectedTest?.category === 'RRB_PYQ' ? TEST_TYPES.RRB_PYQ_SERIES : TEST_TYPES.MOCK_SERIES)} />
                            )}
                            
                            {currentView === TEST_TYPES.CONCENTRATION && <ObservationTest config={selectedTest} testId={selectedTest.id} onComplete={onTestComplete} onExit={() => setCurrentView(TEST_TYPES.MOCK_SERIES)} />}
                            {currentView === TEST_TYPES.FIND_6 && <Find6Test config={selectedTest} testId={selectedTest.id} onComplete={onTestComplete} onExit={() => setCurrentView(TEST_TYPES.MOCK_SERIES)} />}
                            {currentView === TEST_TYPES.TABLE && <TableTest config={selectedTest} onComplete={onTestComplete} onExit={() => setCurrentView(TEST_TYPES.MOCK_SERIES)} />}
                            {currentView === TEST_TYPES.MEMORY && <MemoryTest config={selectedTest} testId={selectedTest.id} onComplete={onTestComplete} onExit={() => setCurrentView(TEST_TYPES.MOCK_SERIES)} />}
                            {currentView === TEST_TYPES.PERCEPTUAL && <PerceptualSpeedTest config={selectedTest} testId={selectedTest.id} onComplete={onTestComplete} onExit={() => setCurrentView(TEST_TYPES.MOCK_SERIES)} />}
                            {currentView === TEST_TYPES.CUSTOM_HTML && <CustomHtmlTest config={selectedTest} onComplete={onTestComplete} onExit={() => setCurrentView(selectedTest?.category === 'RRB_PYQ' ? TEST_TYPES.RRB_PYQ_SERIES : TEST_TYPES.MOCK_SERIES)} />}
                        </main>
                    </div>
                </div>
            );
        };

        class ErrorBoundary extends React.Component {
            constructor(props) { super(props); this.state = { hasError: false }; }
            static getDerivedStateFromError() { return { hasError: true }; }
            render() {
                if (this.state.hasError) {
                    return (
                        <div className="flex flex-col items-center justify-center h-screen bg-slate-50 text-slate-800 p-6 text-center">
                            <h2 className="text-2xl font-black mb-3">Session Reload Required</h2>
                            <button onClick={() => window.location.reload()} className="bg-blue-600 text-white px-6 py-2.5 rounded-xl font-bold">Reload</button>
                        </div>
                    );
                }
                return this.props.children;
            }
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ErrorBoundary><App /></ErrorBoundary>);
    </script>
</body>
</html>
